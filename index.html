      if(g.bySample)return `<div class="gcard"><div class="ic">↔</div><div style="flex:1;min-width:0"><div class="t">${esc(x.from)} ↔ ${esc(x.to)}</div>`+
        `<div class="d">${esc(r.label)} <b>${fx(x.meanA,r,x.nA)}</b> / <b>${fx(x.meanB,r,x.nB)}</b></div><div class="s">차이 ${fx(Math.abs(x.delta),r,Math.max(x.nA,x.nB))} · ${same?'두 값이 같아요':`${esc(up?x.to:x.from)} 쪽이 커요`}</div><div class="addrow">${addBtn(gLine(g,r,x))}</div></div></div>`;
      return `<div class="gcard"><div class="ic ${v==='증가'||(v==='반복 없음'&&up)?'up':v==='감소'||(v==='반복 없음'&&!up&&!same)?'dn':''}">${same?'=':up?'▲':'▼'}</div><div style="flex:1;min-width:0"><div class="t">${esc(x.cond.label)} ${fromTo(x.from,x.to)}</div>`+
        `<div class="d">${esc(r.label)} ${x.nA>1||x.nB>1?'평균 ':''}<b>${fx(x.meanA,r,x.nA)} → ${fx(x.meanB,r,x.nB)}</b> · ${word}</div>`+
        `<div class="s">${[x.others?`${x.others}일 때`:'',x.paired?`같은 ${esc(g.repLabel||'반복')}끼리 ${x.paired.n}쌍 중 ${x.paired.up}쌍 커짐, ${x.paired.down}쌍 작아짐`:'',v==='편차 범위 안'?'측정할 때마다 흔들리는 정도(표준편차)보다 차이가 작아요':v==='반복 없음'?'한 번씩만 측정해서 우연인지는 알 수 없어요':''].filter(Boolean).join(' · ')}</div><div class="addrow">${addBtn(gLine(g,r,x))}</div></div></div>`}).join('')+`</div>`}
  const tied=many?[]:gTied(g,r);
  if(tied.length)o+=`<div class="gh">함께 바뀐 조건</div><div class="gnote">아래 조건은 다른 조건과 같이 바뀌어서, 그 조건만의 효과는 따로 알 수 없어요.</div><div class="gcards">`+tied.map(x=>{const up=x.delta>0,same=x.delta===0;
    return `<div class="gcard"><div class="ic" style="border-style:dashed">${same?'=':up?'▲':'▼'}</div><div style="flex:1;min-width:0"><div class="t">${esc(x.cond.label)} ${fromTo(x.from,x.to)}</div>`+
      `<div class="d">${esc(r.label)} ${Math.max(x.nA,x.nB)>1?'평균 ':''}<b>${fx(x.meanA,r,x.nA)} → ${fx(x.meanB,r,x.nB)}</b> · ${same?'변하지 않았어요':up?'커졌어요':'작아졌어요'}</div>`+
      `<div class="s">같이 바뀐 것: ${x.also.map(q=>`${esc(q.label)} ${esc(q.from)} → ${esc(q.to)}`).join(' · ')}</div><div class="addrow">${addBtn(gTiedLine(g,r,x))}</div></div></div>`}).join('')+`</div>`;
  if(eff.length){}
  else if(many){const ex=gExtremes(g,r);
    if(ex)o+=`<div class="gh">시료 ${g.rows.length}개 중에서</div><div class="gcards">`+
      [['up','▲','가장 큰 값',ex.max],['dn','▼','가장 작은 값',ex.min]].map(([c,ic,t,q])=>`<div class="gcard"><div class="ic ${c}">${ic}</div><div style="flex:1;min-width:0"><div class="t">${t} · ${esc(q.name)}</div><div class="d">${esc(r.label)} <b>${fv(q.res[r.key],r)}</b></div></div></div>`).join('')+
      `<div class="gcard"><div class="ic">↔</div><div style="flex:1;min-width:0"><div class="t">가장 큰 값과 작은 값의 차이</div><div class="d"><b>${fv(ex.max.res[r.key]-ex.min.res[r.key],r)}</b></div><div class="addrow">${addBtn(`${r.label}: 가장 큰 값은 ${ex.max.name}(${fv(ex.max.res[r.key],r)}), 가장 작은 값은 ${ex.min.name}(${fv(ex.min.res[r.key],r)})였다.`)}</div></div></div></div>`}
  else if(g.conds.length&&!tied.length)o+=`<div class="gnote" style="padding-top:16px">조건 하나만 다른 실험 쌍이 없어서 비교할 수 없어요.</div>`;
  // 2. 그래프
  const svg=gChartSVG(g,r);
  o+=`<div class="gh">그래프</div><div class="gnote">점 하나가 측정값 하나예요. 주황 선은 평균, 세로 막대는 측정값이 흩어진 정도, 빨간 점은 확인이 필요한 값이에요.</div>`+(svg?`<div class="gscroll" style="padding:12px 0 2px">${svg}</div>`:`<div class="gnote">이 항목에는 숫자로 된 값이 없어요.</div>`);
  // 3. 요약표
  const rows=gSummary(g,r),rep=rows.some(x=>x.st.n>1);
  o+=`<div class="gh">${rep?'묶음별 평균':'결과 표'}</div><div class="gscroll"><table class="gt"><thead><tr>${g.conds.length?g.conds.map(c=>`<th>${esc(c.label)}</th>`).join(''):'<th>묶음</th>'}${rep?'<th>횟수</th><th>평균</th><th>표준편차</th><th>최소 – 최대</th>':g.results.map(x=>`<th>${esc(x.label)}</th>`).join('')}</tr></thead><tbody>`+
    rows.map(x=>`<tr>${(g.conds.length?x.vals:['전체']).map(v=>`<td>${esc(v)}</td>`).join('')}`+(rep?`<td>${x.st.n}${x.st.none?` · 없음 ${x.st.none}`:''}</td><td>${x.st.n?(x.st.n>1?fm(x.st.mean,r):fv(x.st.mean,r)):''}</td><td>${x.st.sd!=null?fm(x.st.sd,r):''}</td><td>${x.st.n?fv(x.min,r)+' – '+fv(x.max,r):''}</td>`
      :g.results.map(q=>`<td class="${q.key===r.key?'cur':'mu'}">${gCell(x.list[0],q)}</td>`).join(''))+`</tr>`).join('')+`</tbody></table></div>`;
  // 4. 확인이 필요한 값
  const fl=gFlags(g,r),bad=g.rows.filter(x=>fl.has(x.id));
  if(bad.length)o+=`<div class="gh">확인이 필요한 값 ${bad.length}개</div><div class="gcards">`+bad.map(x=>`<div class="gcard"><div class="ic" style="color:#C2504A">!</div><div><div class="t">${esc(x.name)} · ${fv(x.res[r.key],r)}</div><div class="d">${esc(fl.get(x.id))}. 잘못 적었는지, 실제로 달랐는지 확인해 보세요.</div></div></div>`).join('')+`</div>`;
  // 5. 아직 안 해본 조합 (시료끼리 비교할 때는 해당 없음)
  if(g.conds.length&&!g.bySample){const rk=gRank(g,r),all=[...rk.byKey.values()],gm=gGroups(g),planSet=new Set(g.plans.map(pl=>gKey(g,pl)).filter(k=>!gm.has(k)));
    const list=rk.ranked.slice(0,5);V.gtop=list;
    if(all.length){o+=`<div class="gh">아직 안 해본 조합 ${all.length}개</div><div class="gnote">전체 ${gTotal(g)}가지 중 ${gm.size}가지를 했어요.${list.length?' 주변 결과가 좋았던 순서로 보여줘요.':''}${gm.size/gTotal(g)<.34&&gTotal(g)>=12?' 조건들이 원래 함께 바뀌는 실험(묽히면서 섞는 경우 등)이라면 이 목록은 의미가 없을 수 있어요.':''}</div><div class="gcards">`+
      (list.length?list.slice(0,3).map((q,i)=>`<div class="gcard"><div class="ic">${i+1}</div><div style="flex:1;min-width:0"><div class="t">${g.conds.map((c,k)=>`${esc(c.label)} ${esc(q.vals[k])}`).join(' · ')}</div><div class="s">가까운 조합의 평균 ${fm(q.score,r)}</div></div>${planSet.has(q.key)?'<span class="tag o" style="align-self:center">계획됨</span>':`<button class="btn ghost sm" data-a="gPlanTop" data-i="${i}">계획에 추가</button>`}</div>`).join('')
        :all.slice(0,3).map(q=>`<div class="gcard"><div class="ic">?</div><div><div class="t">${g.conds.map((c,k)=>`${esc(c.label)} ${esc(q.vals[k])}`).join(' · ')}</div></div></div>`).join(''))+`</div>`+
      (all.length>3?`<div class="gnote">나머지는 아래 "조합 지도"에서 볼 수 있어요.</div>`:'')}
    else o+=`<div class="gh">안 해본 조합이 없어요</div><div class="gnote">기록에 나온 값으로 만들 수 있는 ${gTotal(g)}가지 조합을 모두 했어요.</div>`}
  return o;
}

// ① 표 넣기: 붙여넣기 → 열 역할 지정 → 가져오기, 한 건씩 추가
function gIn(g,e){
  const sets=measSets(e),mt=measTable(e,g.source==='steps'&&sets.length>1?sets[g.mset||0]:null);
  let out=aiBox()+`<div class="msrc"><button class="${g.source==='steps'?'on':''}" data-a="gSrc" data-s="steps">단계에서 적은 측정값${mt?` · ${mt.count}`:''}</button><button class="${g.source==='table'?'on':''}" data-a="gSrc" data-s="table">표 · 수업 자료</button></div>`;
  if(g.source==='steps'){
    if(!mt)return out+`<div class="empty"><div class="big">${I.flask}</div>아직 적은 측정값이 없어요.<br>단계의 "자세히 · 메모"에서 측정값을 적으면<br>여기에 표로 모이고 그래프가 그려져요.</div>`;
    out+=`<div class="gh">측정 이름마다 역할</div><div class="gnote">바꿔 가며 실험한 값은 "조건", 측정한 값은 "결과"로 두세요. 자동으로 추정했고, 바꾸면 기억해요.${g.bySample?' 지금은 조건으로 둔 항목이 없어서 시료끼리 비교하고 있어요.':''}</div><div style="margin-top:10px;border-top:1px solid var(--line)">`+
      g.mhead.slice(1).map((h,i)=>`<div class="grole"><div class="n"><b>${esc(h)}</b><span>${esc(mt.rows.slice(0,3).map(r=>r[i+1]).filter(Boolean).join(', '))}</span></div><select data-g="mrole" data-h="${esc(h)}" aria-label="${esc(h)}의 역할">${gOpt([['cond','조건 (바꿔 준 값)'],['result','결과 (측정한 값)'],['note','메모'],['skip','무시']],g.mnow[i+1])}</select></div>`).join('')+
      `</div><div class="gh">모인 표 · 시료 ${g.rows.length}개</div>`+gRowsTable(g,true)+
      `<div class="gnote">값을 고치려면 그 단계의 측정값에서 고치세요.</div><div class="grow"><button class="btn ghost sm" data-a="gExport">CSV로 내보내기</button></div>`;
    return out;
  }
  if(g.preset&&g.rows.length)out+=`<div class="hint">수업 자료에 실린 6개 조의 결과가 들어 있어요. 그래프에서 읽은 값이라 원본 숫자와 조금 다를 수 있어요.</div>`;
  if(mt)out+=`<div class="gnote">단계에 적은 측정값이 ${mt.count}개 있어요. 위에서 "단계에서 적은 측정값"을 누르면 그 값으로 볼 수 있어요.</div>`;
  out+=gField('표 붙여넣기 · 첫 줄은 열 이름',`<textarea data-gi="paste" placeholder="엑셀, 마크다운, CSV에서 복사한 표">${esc(V.gpaste||'')}</textarea>`)+
    `<div class="grow"><button class="btn black sm" data-a="gRead">표 읽기</button><button class="btn ghost sm" data-a="gSample">예시 표 넣기</button></div>`+
    `<div class="gnote">조건은 열마다 하나씩 나눠 적어요. "0.1 M + KSCN 5 mL"를 한 칸에 쓰지 말고 농도 열과 부피 열로 나눠요.</div>`;
  if(V.gmsg)out+=`<div class="hint">${esc(V.gmsg)}</div>`;
  if(V.gai&&V.gparsed)out+=`<div class="hint">Claude가 <b>${V.gai.n}줄</b>을 읽어서 위 칸에 채웠어요 (${esc(V.gai.used.slice(0,4).join(', '))}${V.gai.used.length>4?' 등':''}). 숫자를 잘못 읽었을 수 있으니 자료와 맞는지 확인하세요. 위 칸에서 고친 뒤에는 "표 읽기"를 다시 눌러요.${(V.gai.skipped||[]).length?`<br>한 번에 보낼 수 있는 그림 수를 넘어서 사진 ${V.gai.skipped.length}장은 빼고 읽었어요. 나눠서 다시 올려 주세요.`:''}${V.gai.notes?`<br>Claude의 메모: ${esc(V.gai.notes)}`:''}</div>`;
  if(V.gparsed){
    out+=`<div class="gh">열마다 역할 지정</div><div class="gnote">자동으로 추정했어요. 틀린 곳만 바꾸세요. 조건도 결과도 아닌 열(계산값 등)은 "무시"로 두세요.</div><div style="margin-top:10px;border-top:1px solid var(--line)">`+
      V.gparsed.header.map((h,i)=>`<div class="grole"><div class="n"><b>${esc(h)}</b><span>${esc(V.gparsed.rows.slice(0,3).map(r=>r[i]??'').join(', '))}</span></div>`+
        `<select data-g="role" data-i="${i}" aria-label="${esc(h)} 열의 역할">${gOpt(Object.entries(ROLE),V.groles[i])}</select></div>`).join('')+
      `</div><div class="grow"><button class="btn orange" data-a="gImport">가져오기</button></div>`+
      `<div class="gnote">결과 칸이 비어 있으면 "측정 안 함", "없음"이나 "–"이면 "측정했지만 없음"으로 구분해요. 가져오면 이 실험의 기존 표는 바뀌어요.</div>`;
  }
  if(g.results.length){
    out+=`<div class="gh">한 건 추가</div><div class="gpad"><div class="g2">`+gField('이름',`<input id="ga-name">`)+(g.repLabel?gField(g.repLabel,`<input id="ga-rep">`):'')+
      gCondInputs(g,'ga')+g.results.map(r=>gField(r.label,`<input id="ga-${r.key}" placeholder="숫자 또는 없음">`)).join('')+`</div>`+gField('메모',`<input id="ga-note">`).replace('class="gf"','class="gf" style="padding-left:0;padding-right:0"')+`</div>`+
      `<div class="grow"><button class="btn black" data-a="gAdd">${I.plus}추가</button></div>`+
      `<div class="gh">기록 ${g.rows.length}건</div>`+gRowsTable(g)+
      `<div class="grow"><button class="btn ghost sm" data-a="gExport">CSV로 내보내기</button><button class="btn ghost sm" data-a="gClear" style="color:#C2504A">표 비우기</button></div>`;
  }
  return out;
}
function gRowsTable(g,ro){ // ro = 읽기 전용 (단계 측정값에서 만든 표)
  if(!g.rows.length)return `<div class="rs-none" style="padding:10px 18px">아직 기록이 없어요.</div>`;
  return `<div class="gscroll"><table class="gt"><thead><tr><th>이름</th>${gHasRep(g)?`<th>${esc(g.repLabel||'반복')}</th>`:''}${g.conds.map(c=>`<th>${esc(c.label)}</th>`).join('')}${g.results.map(r=>`<th>${esc(r.label)}</th>`).join('')}${gHasNote(g)?'<th>메모</th>':''}<th></th></tr></thead><tbody>`+
    g.rows.map(x=>`<tr><td>${esc(x.name)}</td>${gHasRep(g)?`<td>${esc(x.rep)}</td>`:''}${g.conds.map(c=>`<td>${esc(x.cond[c.key])}</td>`).join('')}${g.results.map(r=>`<td>${gCell(x,r)}</td>`).join('')}${gHasNote(g)?`<td class="wrap">${esc(x.note)}</td>`:''}<td>${ro?'':`<button class="x" data-a="gDel" data-id="${x.id}">삭제</button>`}</td></tr>`).join('')+`</tbody></table></div>`;
}

// ② 비교표 + 조건 하나만 바꿨을 때의 변화
function gCmp(g){
  if(!g.rows.length)return `<div class="empty"><div class="big">${I.doc}</div>비교할 기록이 없어요.<br>단계에서 측정값을 적거나 "데이터"에서 표를 넣으세요.</div>`;
  if(!g.rows.some(x=>x.id===V.gbase))V.gbase=g.rows[0].id;
  const base=g.rows.find(x=>x.id===V.gbase),r=gRes(g),flags=gFlags(g,r);
  let out=gField('기준 실험',`<select data-g="base">${gOpt(g.rows.map(x=>[x.id,x.name]),V.gbase)}</select>`)+
    `<div class="gleg"><span><i class="l-base"></i>기준</span><span><i class="l-diff"></i>기준과 다른 조건</span><span><b class="flag">⚠</b> 확인이 필요한 값</span></div>`+
    `<div class="gscroll"><table class="gt"><thead><tr><th>이름</th>${gHasRep(g)?`<th>${esc(g.repLabel||'반복')}</th>`:''}${g.conds.map(c=>`<th>${esc(c.label)}</th>`).join('')}${g.results.map(x=>`<th>${esc(x.label)}</th>`).join('')}<th>기준 대비</th>${gHasNote(g)?'<th>메모</th>':''}</tr></thead><tbody>`+
    g.rows.map(x=>{const isB=x.id===V.gbase,v=x.res[r.key],bv=base.res[r.key];let d='';
      if(isB)d='–';else if(v!=null&&bv!=null){const k=v-bv;d=k>0?`<span class="upv">▲ ${fv(k,r)}</span>`:k<0?`<span class="dn">▼ ${fv(-k,r)}</span>`:fv(0,r)}
      return `<tr class="${isB?'base':''}"><td>${esc(x.name)}${isB?' <span class="tag o">기준</span>':''}</td>${gHasRep(g)?`<td>${esc(x.rep)}</td>`:''}`+
        g.conds.map(c=>`<td class="${x.cond[c.key]!==base.cond[c.key]?'diff':''}">${esc(x.cond[c.key])}</td>`).join('')+
        g.results.map(q=>`<td class="${q.key===r.key?'cur':'mu'}">${gCell(x,q)}${q.key===r.key&&flags.has(x.id)?` <b class="flag" title="${esc(flags.get(x.id))}">⚠</b>`:''}</td>`).join('')+
        `<td>${d}</td>${gHasNote(g)?`<td class="wrap">${esc(x.note)}</td>`:''}</tr>`}).join('')+`</tbody></table></div>`;
  const eff=gEffects(g,r),MAX=40;
  if(eff.length){const anyP=eff.some(x=>x.paired),anyO=g.conds.length>1;
    out+=`<div class="gh">조건 하나만 바꿨을 때</div><div class="gnote">"${esc(r.label)}" 평균이 얼마나 달라졌는지예요.</div><div class="gscroll"><table class="gt"><thead><tr><th>바꾼 조건</th><th>값</th>${anyO?'<th>나머지 조건</th>':''}<th>평균 변화</th><th>횟수</th>${anyP?`<th>같은 ${esc(g.repLabel||'반복')}끼리</th>`:''}</tr></thead><tbody>`+
      eff.slice(0,MAX).map(x=>`<tr><td>${esc(x.cond.label)}</td><td>${esc(x.from)} → ${esc(x.to)}</td>${anyO?`<td>${esc(x.others)}</td>`:''}<td>${x.delta>0?`<span class="upv">▲ ${fm(x.delta,r)}</span>`:x.delta<0?`<span class="dn">▼ ${fm(-x.delta,r)}</span>`:fm(0,r)}</td><td>${x.nA}회 → ${x.nB}회</td>${anyP?`<td>${x.paired?`${x.paired.n}쌍 중 증가 ${x.paired.up} · 감소 ${x.paired.down}`:''}</td>`:''}</tr>`).join('')+
      `</tbody></table></div>`+(eff.length>MAX?`<div class="gnote">전체 ${eff.length}건 중 ${MAX}건만 보여요.</div>`:'');
  }
  return out;
}

// ③ 조합 지도
function gMap(g){
  if(!g.rows.length)return `<div class="empty"><div class="big">${I.doc}</div>단계에서 측정값을 적거나 "데이터"에서 표를 넣으면 조합 지도가 그려져요.</div>`;
  if(!g.conds.length)return `<div class="empty">조건 열이 없어서 조합 지도를 그릴 수 없어요.<br>조건(농도, 온도 등)을 열마다 하나씩 나눠 적은 표를 가져오세요.</div>`;
  const r=gRes(g),two=g.conds.length>1;
  let ax=V.gax||0;if(ax>=g.conds.length)ax=0;let ay=V.gay??1;if(two&&(ay>=g.conds.length||ay===ax))ay=(ax+1)%g.conds.length;V.gax=ax;V.gay=ay;
  const X=g.conds[ax],Y=two?g.conds[ay]:null,rest=g.conds.filter(c=>c!==X&&c!==Y);V.gfix=V.gfix||{};
  rest.forEach(c=>{if(!gVals(g,c).includes(V.gfix[c.key]))V.gfix[c.key]=gVals(g,c)[0]});
  const names=g.conds.map((c,i)=>[i,c.label]);
  let out=(g.results.length>1?gField('볼 값',`<select data-g="curRes">${gOpt(g.results.map(x=>[x.key,x.label]),r.key)}</select>`):'')+`<div class="gpad"><div class="g2">`+gField('가로축',`<select data-g="ax">${gOpt(names,ax)}</select>`)+(two?gField('세로축',`<select data-g="ay">${gOpt(names,ay)}</select>`):'')+
    rest.map(c=>gField(c.label+' 고정',`<select data-g="fix" data-k="${c.key}">${gOpt(gVals(g,c).map(v=>[v,v]),V.gfix[c.key])}</select>`)).join('')+
    gField('좋은 결과',`<select data-g="better">${gOpt([['high','높은 값'],['low','낮은 값']],g.better)}</select>`)+`</div></div>`;
  const gm=gGroups(g),total=gTotal(g),done=gm.size,planSet=new Set(g.plans.map(p=>gKey(g,p)).filter(k=>!gm.has(k)));
  const lit=new Map();g.refs.forEach(x=>{if(x.cond&&x.rkey===r.key&&x.value!=null){const k=gKey(g,x);if(!lit.has(k))lit.set(k,[]);lit.get(k).push(x.value)}});
  const litT=k=>lit.has(k)?`<span class="lit">문헌 ${lit.get(k).map(v=>fv(v,r)).join(', ')}</span>`:'';
  out+=`<div class="stats" style="margin-top:16px;border-top:1px solid var(--line)"><div><b>${total}</b><span>전체 조합</span></div><div><b>${done}</b><span>실행</span></div><div><b style="color:var(--orange)">${total-done}</b><span>미실행${planSet.size?` · 계획 ${planSet.size}`:''}</span></div></div>`+
    `<div class="bar" style="margin:14px 18px 0"><i style="width:${(done/total*100).toFixed(1)}%"></i></div>`;
  if(total>=20&&done/total<.1)out+=`<div class="gwarn"><b class="flag">⚠</b> 미실행이 전체의 90 %를 넘어요. 측정값이나 계산값 열이 "조건"으로 들어가지 않았는지 "데이터"에서 확인하세요.</div>`;
  out+=`<div class="gleg"><span><i></i>실행 (평균 ± 표준편차)</span><span><i class="l-gap"></i>미실행</span><span><i class="l-plan"></i>계획됨</span></div>`;
  const flags=gFlags(g,r),rank=gRank(g,r),xs=gVals(g,X),ys=Y?gVals(g,Y):[null];
  out+=`<div class="gscroll"><table class="gt gmap"><thead><tr>${Y?`<th rowspan="2">${esc(Y.label)} ↓</th>`:''}<th colspan="${xs.length}">${esc(X.label)} →</th></tr><tr>${xs.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>`+
    ys.map(yv=>`<tr>${Y?`<th>${esc(yv)}</th>`:''}`+xs.map(xv=>{
      const key=g.conds.map(c=>c===X?xv:c===Y?yv:V.gfix[c.key]).join(SEP),list=gm.get(key);
      if(!list){const q=rank.byKey.get(key),pl=planSet.has(key);return `<td class="gap${pl?' plan':''}">${pl?'계획됨':'미실행'}${q&&q.rank?`<span>후보 ${q.rank}순위</span>`:''}${litT(key)}</td>`}
      const st=gStat(list,r),warn=list.some(x=>flags.has(x.id));
      const big=st.n?`<b>${st.n>1?fm(st.mean,r):fv(st.mean,r)}</b>`:`<b class="none">${st.none?'없음':'기록 없음'}</b>`;
      const nm=list.slice(0,2).map(x=>x.name).join(', ')+(list.length>2?` 외 ${list.length-2}`:'');
      return `<td>${big}<span>${st.n>1?`± ${fm(st.sd,r)} · ${st.n}회`:`${list.length}회`}${warn?' <b class="flag">⚠</b>':''}</span><span>${esc(nm)}</span>${litT(key)}</td>`}).join('')+`</tr>`).join('')+`</tbody></table></div>`;
  const top=rank.ranked.slice(0,5);V.gtop=top;
  if(top.length)out+=`<div class="gh">다음 실험 후보</div><ol class="gnext">`+top.map((q,i)=>`<li><div>${g.conds.map((c,k)=>`${esc(c.label)} ${esc(q.vals[k])}`).join(', ')}<span>이웃 칸 평균 ${fm(q.score,r)}</span></div>${planSet.has(q.key)?'<span class="tag o">계획됨</span>':`<button class="btn ghost sm" data-a="gPlanTop" data-i="${i}">계획에 추가</button>`}</li>`).join('')+`</ol>`+
    `<div class="gnote">규칙: 조건 하나만 한 단계 다른 이웃 칸들의 "${esc(r.label)}" 평균이 ${g.better==='high'?'높은':'낮은'} 순서예요. 이웃에 실행한 칸이 없으면 순위에서 빠져요.</div>`;
  out+=`<div class="gh">아직 안 해본 값 추가</div><div class="gpad"><div class="g2">`+gField('조건',`<select id="gx-cond">${gOpt(names,0)}</select>`)+gField('추가할 값',`<input id="gx-val" placeholder="예: 0.5">`)+`</div></div>`+
    `<div class="grow"><button class="btn ghost sm" data-a="gExAdd">값 추가</button></div>`+
    `<div class="chips">${g.conds.map((c,i)=>(c.extra||[]).map(v=>`<span class="chip">${esc(c.label)}: ${esc(v)}<button data-a="gExRm" data-i="${i}" data-v="${esc(v)}" aria-label="삭제">×</button></span>`).join('')).join('')}</div>`;
  return out;
}

      g.plans.map(p=>`<tr>${g.conds.map(c=>`<td>${esc(p.cond[c.key])}</td>`).join('')}<td class="wrap">${esc(p.note)}</td><td>${gm.has(gKey(g,p))?'<span class="tag o">실행함</span>':'<span class="tag">계획</span>'}</td><td><button class="x" data-a="gPlanDel" data-id="${p.id}">삭제</button></td></tr>`).join('')+`</tbody></table></div>`;

  out+=`<div class="gh">선행연구</div>`+(rbusy?`<div class="gpad" style="padding-top:10px"><div class="aist"><i class="spin"></i><span id="aimsg">${esc(AIS.msg)}</span></div><button class="btn ghost sm" data-a="aiStop" style="margin-top:10px">멈추기</button></div>`
    :(curProv()!=='claude')?(P=>`<div class="aibox" style="margin-top:12px"><div class="d" style="margin-top:0">${P.name}로 문헌 정보를 채워요.</div><ol class="aisteps"><li>지시문을 복사해요.<br><button class="btn black sm" data-a="aiCopy" data-k="ref">지시문 복사</button></li><li>${P.name}를 열어 논문이나 자료 파일을 첨부하고, 지시문을 붙여넣어 보내요.<br><a class="btn ghost sm" href="${P.url}" target="_blank" rel="noopener noreferrer">${P.name} 열기</a></li><li>${P.name}의 답을 아래 칸에 붙여넣어요.</li></ol><textarea class="aiprompt" data-d="refans" style="background:#fff;min-height:96px" placeholder="${P.name}의 답 붙여넣기" aria-label="${P.name}의 답">${esc(V.refans||'')}</textarea><button class="btn orange sm" data-a="refPaste" style="margin-top:10px">답으로 채우기</button></div>`)(AI_PROV[curProv()])
    :`<div class="grow" style="padding-top:10px"><button class="btn ghost sm" data-a="aiPick" data-k="ref">${I.doc}논문·자료 파일에서 채우기</button></div><div class="gnote">PPT나 PDF(앞 3쪽), 사진을 올리면 Claude가 읽고 제목·출처·요약을 채워요. 올린 쪽은 Claude로 전송돼요. 다른 AI를 쓰려면 "자료 넣기"에서 AI를 바꾸세요.</div>`)+
    `<div class="gpad">`+gField('제목',`<input id="gr-title" value="${esc(rf.title||'')}" placeholder="논문·교재·자료 제목">`).replace('class="gf"','class="gf" style="padding-left:0;padding-right:0"')+
    `<div class="g2">`+gField('출처',`<input id="gr-source" value="${esc(rf.source||'')}" placeholder="저자, 학술지, 연도">`)+gField('링크 또는 DOI',`<input id="gr-link" value="${esc(rf.link||'')}" placeholder="https://… 또는 10.…">`)+`</div>`+
    gField('내용 요약',`<textarea class="txt" id="gr-note" style="min-height:${rf.note?140:72}px" placeholder="이 문헌에서 참고할 내용">${esc(rf.note||'')}</textarea>`).replace('class="gf"','class="gf" style="padding-left:0;padding-right:0"');
  if(g.conds.length)out+=`<div class="gnote" style="padding-left:0;padding-right:0">선택: 문헌에 보고된 값이 있으면 조건과 함께 적으세요. 조합 지도의 그 칸에 "문헌"으로 표시돼요.</div><div class="g2">${gCondInputs(g,'gr')}`+
    gField('결과 종류',`<select id="gr-rkey">${gOpt(g.results.map(x=>[x.key,x.label]),gRes(g).key)}</select>`)+gField('보고된 값',`<input id="gr-value" placeholder="숫자">`)+`</div>`;
  out+=`</div><div class="grow"><button class="btn black" data-a="gRef">${I.plus}선행연구 추가</button></div>`;
  if(g.refs.length)out+=`<div class="gscroll"><table class="gt"><thead><tr><th>제목</th><th>출처</th><th>요약</th><th>조건과 보고값</th><th></th></tr></thead><tbody>`+
    g.refs.map(x=>{const url=/^https?:\/\//i.test(x.link)?x.link:/^10\.\d{4,}\//.test(x.link)?'https://doi.org/'+x.link:'';const rr=x.rkey?g.results.find(k=>k.key===x.rkey):null;

  return out;
}

async function saveBlob(name,blob,done){ // PDF와 같은 저장 방식
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(_){dl=null}
  if(dl){try{await dl.save({filename:name,data:blob});toast(done)}catch(err){toast(err&&err.code==='declined'?'저장을 취소했어요':'이 화면에서는 저장할 수 없어요')}}
  else{const u=URL.createObjectURL(blob);
    if(!IN_CLAUDE){const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast(done);return} // 독립 웹사이트에서는 바로 내려받음
    sheet(`<h3>파일 완성</h3><p>이 화면에서는 바로 저장이 막혀 있어요. 아래를 눌러 새 창에서 열어 보세요.</p><a class="btn black" href="${u}" target="_blank" rel="noopener" download="${esc(name)}" style="text-decoration:none">${esc(name)} 열기</a>`)}
}

function wrap(x,text,maxW){
  const lines=[];String(text||'').split('\n').forEach(par=>{let cur='';for(const ch of par){const t=cur+ch;if(x.measureText(t).width>maxW&&cur){
    // 영어 단어 중간 끊김 줄이기
    const sp=cur.lastIndexOf(' ');if(sp>cur.length-12&&sp>0&&/[A-Za-z0-9]/.test(ch)){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch}else{lines.push(cur);cur=ch.trim()?ch:''}}else cur=t}lines.push(cur)});
  return lines;
}

function cropOpen(s,p){
  const d=document.createElement('div');d.className='crop';
  d.innerHTML=`<div class="cbar"><button data-c="cancel">취소</button><b>사진 다듬기</b><button data-c="ok" class="ok">적용</button></div>
   <div class="cstage"><div class="cwrap"><img alt=""><div class="cbox"><i class="h nw"></i><i class="h ne"></i><i class="h sw"></i><i class="h se"></i></div></div></div>
   <div class="cbar bot"><button data-c="rot">↺ 왼쪽으로 돌리기</button><button data-c="all">전체 선택</button>${p.orig?'<button data-c="orig">원본으로</button>':''}</div>
   <div class="chint">모서리를 끌어 남길 부분을 정하세요. 상자 안쪽을 끌면 상자가 움직여요.</div>`;
  document.body.appendChild(d);
  const img=d.querySelector('img'),wrap=d.querySelector('.cwrap'),box=d.querySelector('.cbox');
  let work=document.createElement('canvas'),turned=false,restored=false,R={x:0,y:0,w:1,h:1}; // R = 남길 부분 (사진 크기에 대한 비율 0~1)
  const place=()=>{box.style.left=R.x*100+'%';box.style.top=R.y*100+'%';box.style.width=R.w*100+'%';box.style.height=R.h*100+'%'};
  const show=()=>{img.src=work.toDataURL('image/jpeg',.9);R={x:0,y:0,w:1,h:1};place()};
  const loadSrc=async src=>{const im=await imgEl(src);if(!im)return;work.width=im.naturalWidth;work.height=im.naturalHeight;work.getContext('2d').drawImage(im,0,0);show()};
  loadSrc(p.src);
  // 끌기: 모서리는 크기 조절, 상자 안쪽은 이동
  let drag=null;
  box.addEventListener('pointerdown',ev=>{ev.preventDefault();const b=wrap.getBoundingClientRect();
    drag={mode:ev.target.classList.contains('h')?ev.target.className.replace('h','').trim():'move',x0:ev.clientX,y0:ev.clientY,o:{...R},W:b.width,H:b.height};
    try{box.setPointerCapture(ev.pointerId)}catch(_){}});
  box.addEventListener('pointermove',ev=>{if(!drag)return;const o=drag.o,dx=(ev.clientX-drag.x0)/drag.W,dy=(ev.clientY-drag.y0)/drag.H,mw=Math.min(.5,44/drag.W),mh=Math.min(.5,44/drag.H);
    let {x,y,w,h}=o;
    if(drag.mode==='move'){x=Math.max(0,Math.min(1-w,o.x+dx));y=Math.max(0,Math.min(1-h,o.y+dy))}
    else{
      if(drag.mode.includes('w')){x=Math.max(0,Math.min(o.x+o.w-mw,o.x+dx));w=o.x+o.w-x}
      if(drag.mode.includes('e'))w=Math.max(mw,Math.min(1-o.x,o.w+dx));
      if(drag.mode.includes('n')){y=Math.max(0,Math.min(o.y+o.h-mh,o.y+dy));h=o.y+o.h-y}
      if(drag.mode.includes('s'))h=Math.max(mh,Math.min(1-o.y,o.h+dy));
    }
    R={x,y,w,h};place()});
  const end=()=>{drag=null};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  d.addEventListener('click',async ev=>{const c=ev.target.dataset.c;if(!c)return;
    if(c==='cancel')d.remove();
    else if(c==='all'){R={x:0,y:0,w:1,h:1};place()}
    else if(c==='rot'){ // 왼쪽으로 90도
      const n=document.createElement('canvas');n.width=work.height;n.height=work.width;const x=n.getContext('2d');x.translate(0,n.height);x.rotate(-Math.PI/2);x.drawImage(work,0,0);work=n;turned=true;show()}
    else if(c==='orig'){await loadSrc(p.orig);restored=true;turned=false}
    else if(c==='ok'){
      const full=R.x<.005&&R.y<.005&&R.w>.99&&R.h>.99;
      if(full&&!turned&&!restored){d.remove();return} // 바꾼 것이 없음
      if(full&&!turned&&restored){p.src=p.orig;delete p.orig} // 원본으로 되돌리기만 함
      else{const sx=Math.round(R.x*work.width),sy=Math.round(R.y*work.height),sw=Math.max(1,Math.round(R.w*work.width)),sh=Math.max(1,Math.round(R.h*work.height));
        const o=document.createElement('canvas');o.width=sw;o.height=sh;o.getContext('2d').drawImage(work,sx,sy,sw,sh,0,0,sw,sh);
        if(!p.orig)p.orig=p.src;p.src=o.toDataURL('image/jpeg',.86)}
      save();d.remove();render();toast('사진을 다듬었어요')}
  });
}

function parsePages(t){ // "13-15, 18" → [13,14,15,18]

    for(let i=Math.min(a,b);i<=Math.max(a,b)&&out.length<200;i++)if(!out.includes(i))out.push(i)});
  return out;
}
async function imgBlob(file,max=1500){const im=await loadImg(file);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(im.src);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function zipLib(){if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');return window.JSZip}
const isPdf=f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name),isPptx=f=>/\.pptx$/i.test(f.name);
// 사진: 폰으로 찍어 바로 올리는 경우 (jpg, png 등)
const isImg=f=>/^image\//i.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name);
// PPT(.pptx): 슬라이드의 글자, 차트에 들어 있는 숫자, 슬라이드에 붙은 그림을 꺼냄
async function pptxParts(f,want,room,say){
  say(`${f.name} 여는 중`);
  const Z=await zipLib(),zip=await Z.loadAsync(await f.arrayBuffer());
  const xml=async path=>{const q=zip.file(path);return q?new DOMParser().parseFromString(await q.async('string'),'application/xml'):null};
  const norm=path=>{const o=[];path.split('/').forEach(k=>{if(k==='..')o.pop();else if(k&&k!=='.')o.push(k)});return o.join('/')};
  const relsOf=async(path,dir)=>{const d=await xml(path.replace(/([^/]+)$/,'_rels/$1.rels'));return d?[...d.getElementsByTagName('Relationship')].map(r=>({type:r.getAttribute('Type')||'',target:norm(dir+'/'+r.getAttribute('Target')),id:r.getAttribute('Id')})):[]};
  // 슬라이드 순서는 presentation.xml에 적힌 차례를 따름
  const pres=await xml('ppt/presentation.xml'),pr=await relsOf('ppt/presentation.xml','ppt');
  let order=pres?[...pres.getElementsByTagName('p:sldId')].map(k=>(pr.find(r=>r.id===k.getAttribute('r:id'))||{}).target).filter(Boolean):[];
  if(!order.length)order=Object.keys(zip.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>+a.match(/(\d+)\.xml$/)[1]-+b.match(/(\d+)\.xml$/)[1]);
  const n=order.length,texts=[],pics=[];
  for(let i=0;i<n;i++){
    const d=await xml(order[i]),rels=await relsOf(order[i],'ppt/slides');let t='';
    if(d)t=[...d.getElementsByTagName('a:p')].map(q=>[...q.getElementsByTagName('a:t')].map(k=>k.textContent).join('')).filter(Boolean).join(' / ');
    for(const r of rels.filter(k=>/\/chart$/.test(k.type))){const c=await xml(r.target);if(!c)continue; // 차트에 저장된 숫자
      const pts=el=>el?[...el.getElementsByTagName('c:pt')].map(k=>(k.getElementsByTagName('c:v')[0]||{}).textContent||''):[];
      [...c.getElementsByTagName('c:ser')].forEach(ser=>{const nm=pts(ser.getElementsByTagName('c:tx')[0]).join(' '),cat=pts(ser.getElementsByTagName('c:cat')[0]||ser.getElementsByTagName('c:xVal')[0]),val=pts(ser.getElementsByTagName('c:val')[0]||ser.getElementsByTagName('c:yVal')[0]);
        if(val.length)t+=` / [차트 ${nm}] 가로축: ${cat.join(', ')} | 값: ${val.join(', ')}`})}
    if(t)texts.push(`[${f.name} ${i+1}쪽] ${t.slice(0,2500)}`);
    pics.push(rels.filter(k=>/\/image$/.test(k.type)&&/\.(png|jpe?g|gif|bmp|webp)$/i.test(k.target)).map(k=>k.target));
  }
  let pages=want.length?want.filter(k=>k>=1&&k<=n):[...Array(n)].map((_,k)=>k+1);
  if(!want.length){let c=0,keep=[];for(const k of [...pages].reverse()){if(c>=room)break;if(pics[k-1].length){keep.unshift(k);c+=pics[k-1].length}}pages=keep} // 따로 정하지 않으면 그림이 있는 뒤쪽 슬라이드부터
  const images=[],used=[];
  for(const k of pages)for(const path of pics[k-1]){if(images.length>=room)break;say(`${f.name} ${k}쪽의 그림을 꺼내는 중 · 전체 ${n}쪽`);
    try{const ab=await zip.file(path).async('arraybuffer'),ext=path.split('.').pop().toLowerCase();images.push(await imgBlob(new Blob([ab],{type:'image/'+(ext==='jpg'?'jpeg':ext)})));if(!used.includes(`${f.name} ${k}쪽`))used.push(`${f.name} ${k}쪽`)}catch(_){}}
  return {texts,images,used,n};
}
// 파일들을 Claude에게 보낼 그림과 글자로 바꿈. want = 읽을 쪽(없으면 뒤쪽부터), maxN = 보낼 수 있는 그림 수
async function fileParts(files,want,maxN,say){
  const texts=[],images=[],used=[],skipped=[];
  files=[...files].sort((a,b)=>isImg(b)-isImg(a)); // 직접 고른 사진을 먼저 넣고, 남는 자리에 PPT·PDF의 쪽을 넣음
  for(const f of files){
    const room=maxN-images.length;
    if(isPptx(f)){const r=await pptxParts(f,want,Math.max(0,room),say);texts.push(...r.texts);images.push(...r.images);used.push(...r.used);if(!r.used.length&&r.texts.length)used.push(`${f.name} 글자 ${r.n}쪽`)}
    else if(isPdf(f)){
      say(`${f.name} 여는 중`);
      const lib=await pdfLib(),doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,n=doc.numPages;
      for(let i=1;i<=n;i++){const tc=await (await doc.getPage(i)).getTextContent(),t=tc.items.map(q=>q.str).join(' ').replace(/\s+/g,' ').trim();if(t)texts.push(`[${f.name} ${i}쪽] ${t.slice(0,1500)}`)}
      let pages=want.length?want.filter(k=>k>=1&&k<=n):[...Array(n)].map((_,k)=>k+1);
      if(pages.length>room)pages=want.length?pages.slice(0,Math.max(0,room)):pages.slice(-room||n); // 따로 정하지 않으면 뒤쪽 (결과는 보통 뒤에 있음)
      if(room<=0)pages=[];
      for(const k of pages){say(`${f.name} ${k}쪽을 그림으로 바꾸는 중 · 전체 ${n}쪽`);
        const pg=await doc.getPage(k),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2,1500/Math.max(v0.width,v0.height))});
        const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:cx,viewport:vp}).promise;images.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)));used.push(`${f.name} ${k}쪽`)}
    }else if(isImg(f)){
      if(room<=0){skipped.push(f.name);continue} // 보낼 수 있는 그림 수를 넘으면 건너뜀
      say(`${f.name} 여는 중`);
      try{images.push(await imgBlob(f));used.push(f.name)}catch(_){toast(`이 사진은 열 수 없어요 · ${esc(f.name)}`)}
    }
  }
  return {text:texts.join('\n').slice(0,30000),images,used,skipped};
}
const aiTablePrompt=(e,txt)=>`너는 화학 실험 자료에서 숫자 데이터를 표로 옮기는 일을 한다. 함께 보낸 그림(슬라이드·보고서·사진)과 아래 글자에서 이 실험의 결과 숫자를 찾아 표 하나로 정리해라.

규칙
- 자료에 실제로 적혀 있는 숫자만 옮긴다. 그래프에 숫자 라벨이 없으면 눈금으로 어림하지 말고 빈 문자열로 둔다. 추측하지 않는다.
- 한 줄은 측정 하나다(시료 하나, 또는 한 조의 시료 하나). 여러 조의 결과가 있으면 조마다 줄을 나눈다.
- 열의 종류 kind: "name" = 줄 이름(최대 1개), "rep" = 조·회차 번호(최대 1개), "cond" = 실험자가 바꿔 준 값(농도, 부피, 온도, 시간, 세척 여부, 화합물 종류 등), "result" = 측정한 숫자(피크 위치, 흡광도, 수득량 등), "note" = 글로 된 관찰.
- 단위는 unit에 따로 적고, 값에는 숫자만 적는다. 측정했지만 신호가 없다고 자료에 적혀 있으면 "없음"으로 적는다.
- 모든 시료에 똑같은 값(실험 방법의 시약 사용량 등)과, 이 실험의 결과가 아닌 일반 설명(이론 표, 예시 그림)의 숫자는 넣지 않는다.
- 숫자를 하나도 찾지 못하면 columns와 rows를 빈 배열로 둔다.

아래 모양의 JSON 하나만 답한다. 설명이나 코드 블록 표시는 붙이지 않는다.
{"columns":[{"name":"열 이름","unit":"단위 또는 빈 문자열","kind":"name|rep|cond|result|note"}],"rows":[["첫 열 값","둘째 열 값"]],"notes":"읽기 어려웠거나 사람이 확인해야 할 점을 한국어 한두 문장으로. 없으면 빈 문자열"}

실험: ${e.no} ${e.title}
${txt?`자료에서 뽑은 글자:\n${txt}`:'(글자를 뽑을 수 없는 자료다. 그림만 보고 판단한다.)'}`;

${txt?`자료에서 뽑은 글자:\n${txt}`:'(글자를 뽑을 수 없는 자료다. 그림만 보고 판단한다.)'}`;
const aiClean=v=>String(v??'').replace(/[\t\n\r]+/g,' ').trim();
function aiFillTable(d,parts){ // 읽은 표를 "표 붙여넣기" 칸과 "열 역할 지정"에 채움
  const cols=Array.isArray(d&&d.columns)?d.columns.filter(c=>c&&aiClean(c.name)):[],rows=Array.isArray(d&&d.rows)?d.rows.filter(Array.isArray):[];
  V.gopen=V.gopen||{};V.gopen.in=true;V.gauto=false;
  if(!cols.length||!rows.length){V.gai=null;V.gparsed=null;V.gmsg='표로 옮길 숫자를 찾지 못했어요.'+(d&&aiClean(d.notes)?' Claude의 메모: '+aiClean(d.notes):'')+' 읽을 쪽을 바꿔서 다시 해 보세요.';return}
  const head=cols.map(c=>aiClean(c.name)+(aiClean(c.unit)?` (${aiClean(c.unit)})`:''));
  V.gpaste=[head.join('\t')].concat(rows.map(r=>cols.map((_,i)=>aiClean(r[i])).join('\t'))).join('\n');
  V.gparsed=parseTable(V.gpaste);
  const guess=guessRoles(V.gparsed.header,V.gparsed.rows),seen={};
  V.groles=cols.map((c,i)=>{const k=['name','rep','cond','result','note'].includes(c.kind)?c.kind:guess[i];if((k==='name'||k==='rep')&&seen[k])return 'cond';seen[k]=1;return k});
  if(!V.groles.includes('result'))V.groles=guess;
  V.gai={n:rows.length,used:parts.used,notes:aiClean(d.notes),skipped:parts.skipped||[]};V.gmsg='';
  const g=G();if(g.source!=='table')A.gSrc({dataset:{s:'table'}}); // 파일에서 읽은 표는 "표" 쪽으로 들어감
}
function aiFillRef(d){
  const vals=Array.isArray(d&&d.values)?d.values.filter(q=>q&&aiClean(q.value)).map(q=>`${aiClean(q.what)} ${aiClean(q.value)}${aiClean(q.unit)?' '+aiClean(q.unit):''}`):[];
  V.gref={title:aiClean(d&&d.title),source:aiClean(d&&d.source),link:aiClean(d&&d.link),note:[aiClean(d&&d.summary),vals.length?'보고값: '+vals.join(' / '):''].filter(Boolean).join('\n')};
  V.gopen=V.gopen||{};V.gopen.note=true;
  if(!V.gref.title&&!V.gref.note){V.gref=null;toast('문헌 정보를 찾지 못했어요');return}
  toast('문헌 정보를 채웠어요 · 확인하고 "선행연구 추가"를 누르세요');
}
async function aiRun(files,kind){
  const e=exp();if(AIS.busy||!e)return;
  if(files.some(f=>/\.ppt$/i.test(f.name)))return toast('옛 형식(.ppt)은 읽지 못해요 · .pptx나 PDF로 저장해서 올려 주세요');
  if(files.some(f=>!isPdf(f)&&!isPptx(f)&&!isImg(f)))return toast('PPT(.pptx), PDF, 사진만 올릴 수 있어요');
  const say=m=>{AIS.msg=m;const el=$('#aimsg');if(el)el.textContent=m};
  AIS.busy=true;AIS.kind=kind;AIS.ctl=new AbortController();AIS.msg='준비하는 중';render();
  try{
    const ai=await aiGet();if(!ai)throw {code:'none'};
    const lim=await ai.limits().catch(()=>null),canImg=!!(lim&&lim.images);
    const maxN=canImg?Math.max(1,Math.min(lim.images.maxCount||4,kind==='ref'?3:8)):0;
    const parts=await fileParts(files,kind==='ref'?[1,2,3]:parsePages(V.gpages),maxN,say);
    if(!parts.images.length&&!parts.text)throw {code:canImg?'nofile':'images_unavailable'};
    say(`Claude가 ${parts.images.length?parts.images.length+'쪽의 그림과 ':''}글자를 읽는 중 · 보통 10초에서 1분쯤 걸려요`);
    const opt={signal:AIS.ctl.signal};if(parts.images.length)opt.images=parts.images;
    const d=await ai.json(kind==='ref'?aiRefPrompt(e,parts.text):aiTablePrompt(e,parts.text),opt);
    if(exp()===e){if(kind==='ref')aiFillRef(d);else{aiFillTable(d,parts);if(V.gparsed)toast(`Claude가 <b>${V.gai.n}줄</b>을 읽었어요 · 확인하고 가져오세요`)}}
  }catch(err){const c=err&&err.code;if(!c)console.error(err);toast(AI_ERR[c]||'읽는 중에 문제가 생겼어요 · 다시 해 보세요')}
  AIS.busy=false;AIS.ctl=null;render();
}

function mergeExp(a,b){ // b(받은 것)를 a(내 것)에 합침. 무엇이 얼마나 들어왔는지 돌려줌
  const n={ph:0,st:0,ms:0,ob:0};
  b.steps.forEach((bs,bi)=>{let as=a.steps.find(q=>q.id===bs.id);
    if(!as){as=clone(bs);a.steps.splice(Math.min(bi,a.steps.length),0,as);n.st++;n.ph+=as.photos.length;n.ms+=(as.meas||[]).length;return}
    bs.photos.forEach(ph=>{if(!as.photos.some(q=>q.id===ph.id)){as.photos.push(clone(ph));n.ph++}});
    as.photos.sort((x,y)=>(x.at||0)-(y.at||0));
    // 관찰 메모: 한쪽이 다른 쪽을 이어 쓴 것이면 긴 쪽을, 서로 다른 내용이면 지우지 않고 둘 다 남김
    {const mt=(as.obs&&as.obs.text)||'',bt=(bs.obs&&bs.obs.text)||'';
     if(bt&&!mt.includes(bt)){as.obs=!mt||bt.includes(mt)?{...bs.obs}:{text:mt+'\n— '+(bs.obs.by||'팀원')+': '+bt,by:as.obs.by,at:Math.max(as.obs.at||0,bs.obs.at||0)};n.ob++}}
    mEnsure(as);(bs.mcols||[]).forEach(c=>{if(!as.mcols.some(q=>mKey(q)===mKey(c)))as.mcols.push({...c})});(bs.mrows||[]).forEach(r=>{if(!as.mrows.includes(r))as.mrows.push(r)});
    (bs.meas||[]).forEach(m=>{const k=as.meas.findIndex(q=>q.sample===m.sample&&mKey(q)===mKey(m));
      if(k<0){as.meas.push({...m});n.ms++}else if(m.value!==as.meas[k].value&&(m.at||0)>(as.meas[k].at||0)){as.meas[k]={...m};n.ms++}})});
  a.report=a.report||{goal:'',theory:'',concl:'',disc:''};const br=b.report||{};
  ['goal','theory','concl','disc'].forEach(k=>{if(!String(a.report[k]||'').trim()&&br[k])a.report[k]=br[k]}); // 보고서 글은 내 것이 비어 있을 때만 받음
  if(b.gap&&(b.gap.rows||[]).length&&b.gap.source==='table'&&!(a.gap&&(a.gap.rows||[]).length))a.gap=clone(b.gap);
  return n;
}
const validExp=e=>e&&typeof e.id==='string'&&Array.isArray(e.steps)&&e.steps.every(q=>q&&typeof q.id==='string'&&Array.isArray(q.photos));
// 받은 실험 하나를 팀 t에 넣거나, 같은 실험이 있으면 합침
function takeExp(t,e){

  let mine=null;S.teams.forEach(k=>k.experiments.forEach(x=>{if(x.id===e.id)mine=x}));
  if(mine)return {merged:true,title:mine.title,n:mergeExp(mine,e)};
  t.experiments.unshift(e);return {merged:false,title:e.title,n:{ph:e.steps.reduce((p,q)=>p+q.photos.length,0),st:e.steps.length,ms:e.steps.reduce((p,q)=>p+(q.meas||[]).length,0),ob:0}};
}

- goal은 자료의 실험 목표를 그대로 옮긴다. theory는 자료의 이론 부분을 한국어 3~5문장으로 요약한다. 자료에 없으면 빈 문자열로 둔다.

${txt?`자료에서 뽑은 글자:\n${txt}`:'(글자를 뽑을 수 없는 자료다. 함께 보낸 그림만 보고 판단한다.)'}`;

function parseStepsAnswer(text){ // 위 지시문에 대한 답을 읽음
  const meta={};text.split(/\r?\n/).forEach(l=>{const m=l.replace(/[*_`#>]/g,'').match(/^\s*-?\s*(실험 번호|제목|과목|목표|원리)\s*[:：]\s*(.*)$/);if(m&&meta[m[1]]===undefined)meta[m[1]]=m[2].trim()});
  const p=parseTable(text);if(!p)return null;
  const h=p.header.map(x=>x.replace(/\s/g,'')),ci=re=>h.findIndex(x=>re.test(x));
  let a=ci(/구간|부분/),b=ci(/단계|이름/),c=ci(/할일|내용|설명/);
  if(b<0){if(p.header.length>=3){a=0;b=1;c=2}else{a=-1;b=0;c=1}}
  const steps=p.rows.map(r=>({section:(a>=0?r[a]:'')||'실험 과정',title:(r[b]||'').trim(),detail:(c>=0?r[c]:'')||''})).filter(q=>q.title&&!/^[.…]+$/.test(q.title));
  return steps.length?{no:meta['실험 번호']||'',title:meta['제목']||'',course:meta['과목']||'',goal:meta['목표']||'',theory:meta['원리']||'',steps}:null;
}
function stepsToDraft(d,file){ // 읽은 단계를 "확인하고 고치기" 화면에 올림

  if(!steps.length)return false;
  V.draft={no:aiClean(d.no),title:aiClean(d.title)||String(file||'').split(',')[0].replace(/\.[^.]+$/,''),course:aiClean(d.course)||(team()||{}).course||'',goal:aiClean(d.goal),theory:String(d.theory??'').trim(),steps,notes:aiClean(d.notes),ai:true};
  V.stage='review';return true;
}

// 글자를 적는 중이거나 덮개 화면이 떠 있으면 화면을 다시 그리지 않고 미뤄 둠 (적던 글자와 커서를 지키려고)
function softRender(){
  if(['add','edit'].includes(V.name))return;
  const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='file';
  if(typing||document.querySelector('.sheet-bg,.crop,.viewer')){SYNC.wantRender=true;return}
  SYNC.wantRender=false;const y=window.scrollY;render();window.scrollTo(0,y);
}
document.addEventListener('focusout',()=>{if(SYNC.wantRender)setTimeout(()=>{if(SYNC.wantRender)softRender()},300)});
async function syncTeam(t){
  const sy=t.sync,code=sy.code;sy.sent=sy.sent||{};let changed=false,got={ph:0,ms:0,ex:0},stuck=false;
  // 1) 받기: 지난번 이후에 바뀐 실험만
  const rows=await rpc('ls_pull_exps',{p_code:code,p_since:SYNC.since[code]||null})||[];
  for(const row of rows){
    const k=code+'|'+row.exp_id,d=row.data;SYNC.seen[k]=row.updated_at;
    if(d&&typeof d==='object'&&d.teamName!==undefined){ // 참여한 팀은 만든 사람이 지은 팀 이름을 받아 씀
      if(t.joined&&!t.named&&String(d.teamName).trim()){t.name=String(d.teamName).trim().slice(0,60);t.course=String(d.teamCourse||'').slice(0,60);t.named=true;changed=true;got.nm=1}
      delete d.teamName;delete d.teamCourse}
    if(validExp(d)&&!(sy.gone&&sy.gone[row.exp_id])){ // 이 기기에서 지운 실험은 다시 받지 않음
      const have=new Map();S.teams.forEach(tt=>tt.experiments.forEach(x=>{if(x.id===d.id)x.steps.forEach(q=>q.photos.forEach(p=>have.set(p.id,p.src)))}));
      const need=[];d.steps.forEach(q=>q.photos.forEach(p=>{if(p&&have.has(p.id))p.src=have.get(p.id);else if(p&&typeof p.id==='string')need.push(p.id)}));
      const srcs=new Map();
      for(let i=0;i<need.length;i+=3)(await rpc('ls_get_photos',{p_code:code,p_ids:need.slice(i,i+3)})||[]).forEach(x=>srcs.set(x.photo_id,x.src));
      d.steps.forEach(q=>q.photos.forEach(p=>{if(p&&!p.src){if(srcs.has(p.id)){p.src=srcs.get(p.id);sy.sent[p.id]=1}else stuck=true}})); // 아직 서버에 없는 사진은 다음 번에 다시 받음
      const r=takeExp(t,d);
      if(!r.merged){changed=true;got.ex++;got.ph+=r.n.ph}else if(r.n.ph||r.n.st||r.n.ms||r.n.ob){changed=true;got.ph+=r.n.ph;got.ms+=r.n.ms}
    }
    if(!stuck)SYNC.since[code]=row.updated_at;
  }
  // 2) 보내기: 새 사진을 먼저 올리고, 글자 부분이 바뀐 실험을 올림
  for(const e of t.experiments){
    const k=code+'|'+e.id;
    for(const q of e.steps)for(const p of q.photos)if(!sy.sent[p.id]){await rpc('ls_push_photo',{p_code:code,p_photo_id:p.id,p_src:p.src});sy.sent[p.id]=1;changed=true}
    const s=lightExp(e);if(SYNC.sig[k]===s)continue;
    const data=JSON.parse(s);if(!t.joined||t.named){data.teamName=t.name;data.teamCourse=t.course||''}
    const at=await rpc('ls_push_exp',{p_code:code,p_exp_id:e.id,p_data:data,p_base:SYNC.seen[k]||null});
    if(at){SYNC.seen[k]=at;SYNC.sig[k]=s} // null이면 다른 기기가 먼저 바꾼 것 → 다음 번에 받아서 합친 뒤 다시 올림
  }
  return {changed,got};
}
// 지금 참여 중인 사람: 몇 초마다 "나 여기 있어" 신호를 보내고, 최근 20초 안에 신호를 보낸 사람 목록을 받음
SYNC.online={};
const onlineOf=t=>t&&t.sync&&t.sync.code&&SYNC.online[t.sync.code]?SYNC.online[t.sync.code]:null;
async function pingTeam(t){
  const code=t.sync.code,me=S.me&&S.me.id?S.me.id:'guest-'+ME;
  const list=await rpc('ls_ping',{p_code:code,p_id:me,p_name:ME})||[];
  const prev=SYNC.online[code]||[],key=l=>l.map(x=>x.uid).sort().join('|');
  SYNC.online[code]=list;
  if(key(prev)!==key(list)){
    const pid=new Set(prev.map(x=>x.uid)),neu=prev.length?list.filter(x=>!pid.has(x.uid)&&x.uid!==me):[];
    if(neu.length)toast(`<b>${neu.map(x=>esc(x.uname)).join(', ')}</b> 님이 들어왔어요`);
    if(['team','members'].includes(V.name))softRender();
  }
}
async function syncTick(){
  if(!SYNC.on||SYNC.busy||document.hidden)return;
  const ts=S.teams.filter(t=>t.sync&&t.sync.code);if(!ts.length)return;
  SYNC.busy=true;
  for(const t of ts){
    try{await pingTeam(t)}catch(_){}
    try{const r=await syncTeam(t);SYNC.err='';SYNC.last=Date.now();
      if(r.changed){save();if(r.got.nm&&!(r.got.ex||r.got.ph||r.got.ms))softRender();if(r.got.ex||r.got.ph||r.got.ms){softRender();toast(`팀원의 기록이 들어왔어요${r.got.ex?` · 새 실험 ${r.got.ex}개`:''}${r.got.ph?` · 사진 ${r.got.ph}장`:''}${r.got.ms?` · 측정값 ${r.got.ms}개`:''}`)}}
    }catch(err){SYNC.err=String(err&&err.message||err)}
  }
  SYNC.busy=false;const el=$('#syncst');if(el)el.textContent=syncStatus();
}
setInterval(syncTick,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTick()});
// 코드로 팀에 참여: 그 코드의 팀이 이 기기에 없으면 새로 만들어 연결하고, 바로 그 팀 화면으로 감
function joinByCode(input){
  const raw=String(input||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(raw.length!==12){toast('코드 12자리를 입력하세요');return false}
  const c=fmtCode(raw);let t=S.teams.find(x=>x.sync&&x.sync.code===c);
  if(!t){t={id:uid(),name:'참여한 팀',course:'',experiments:[],sync:{code:c,sent:{}},joined:true};
    S.teams=S.teams.filter(x=>!(x.id==='t1'&&!x.experiments.length&&!x.sync)); // 처음부터 있던 빈 팀은 치움
    S.teams.unshift(t)}
  save();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  hist.length=0;hist.push({name:'teams'});V={name:'team',tid:t.id};render();window.scrollTo(0,0);syncTick();
  toast('팀에 참여했어요 · 곧 팀의 기록을 받아 와요');return true;
}
Object.assign(A,{
  async syncLink(){const c=((team().sync||{}).code||'').replace(/[^A-Z0-9]/g,''),u=location.origin+location.pathname+'#'+c;
    try{await navigator.clipboard.writeText(u);toast('초대 링크를 복사했어요 · 팀원에게 보내 주세요')}catch(_){toast('복사하지 못했어요 · 코드를 직접 알려 주세요')}},
  // 실험 하나 지우기: 두 번 눌러야 지워짐. 공유 중이어도 이 기기에서만 지워지고, 다시 받아 오지 않게 표시해 둠
  delExp(el){const t=team(),e=exp();if(!t||!e)return;
    if(!el.classList.contains('arm')){el.classList.add('arm');el.style.color='#C2504A';el.textContent='한 번 더 누르면 사진과 기록이 모두 지워져요';setTimeout(()=>{if(el.isConnected){el.classList.remove('arm');el.style.color='';el.textContent='이 실험 지우기'}},3500);return}
    t.experiments=t.experiments.filter(x=>x.id!==e.id);if(t.sync){t.sync.gone=t.sync.gone||{};t.sync.gone[e.id]=1}
    save();hist.length=0;hist.push({name:'teams'});V={name:'team',tid:t.id};render();window.scrollTo(0,0);toast(`<b>${esc(e.title)}</b> 실험을 지웠어요`)},
  syncNew(){const t=team();t.sync={code:fmtCode(code()+code().slice(0,4)),sent:{}};save();render();syncTick();toast('공유를 시작했어요 · 코드를 팀원에게 알려 주세요')},
  syncJoin(){const raw=$('#sync-code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(raw.length!==12){$('#sync-code').focus();return toast('코드 12자리를 입력하세요')}
    const t=team();t.sync={code:fmtCode(raw),sent:{}};save();document.activeElement&&document.activeElement.blur();render();syncTick();toast('참여했어요 · 곧 팀의 기록을 받아 와요')},
  syncOff(el){if(!el.classList.contains('arm')){el.classList.add('arm');el.style.color='#C2504A';el.textContent='한 번 더 누르면 꺼요';return}
    const t=team();delete t.sync;save();render();toast('공유를 껐어요 · 지금까지 받은 기록은 이 기기에 남아요')},
  async syncCopy(){const c=(team().sync||{}).code||'';try{await navigator.clipboard.writeText(c);toast('코드를 복사했어요')}catch(_){toast('복사하지 못했어요 · 코드를 길게 눌러 복사하세요')}}
});

/* ---------- boot ---------- */
(async()=>{
  render();
  if(await DB.open()){const st=await DB.get();if(st&&st.teams){S=st;if(S.me&&S.me.name)ME=S.me.name;if(S.loggedIn&&!(S.me&&S.me.src==='account'&&S.me.name))S.loggedIn=false; // 예전 시안의 저장본에는 이름이 없으므로 이름부터 받음
    if(S.loggedIn){V={name:'teams'}}render()}}
  if(S.loggedIn&&PENDING&&SYNC.on){const c=PENDING;PENDING='';joinByCode(c)} // 이미 쓰던 사람이 초대 링크를 연 경우
  // Claude에 로그인한 사람이면 그 이름을 씀 (못 가져오면 첫 화면에서 직접 적음)
  try{const u=window.claude&&window.claude.use?await window.claude.use('user'):null,m=u?await u.me():null;
    if(m&&m.name&&!(S.me&&S.me.src==='claude'&&S.me.name===m.name)){S.me={name:m.name,id:m.id||null,src:'claude'};ME=m.name;save();if(['login','teams','team','members'].includes(V.name))render()}}catch(_){}
})();
</script>
