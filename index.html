<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>랩스텝 LabStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* 부드러운 흰 바탕, 남색 글자, 연보라빛 파랑 강조, 형광펜 노랑 하나 */
  --ink:#252B3B; --paper:#FFFFFF; --bg:#F5F6FA; --line:#E7E9F1; --line2:#CFD4E2; --edge:#DDE1EC;
  --muted:#687083; --orange:#5266E0; --orange-soft:#EEF0FD; --accent-ink:#3F51C4; --hl:#FFE169; --danger:#C2504A;
  --sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --round:'Jua','Gowun Dodum','Apple SD Gothic Neo',sans-serif;
  --serif:var(--round);
  --mono:var(--sans);
  --r:16px; --r-sm:12px;
  --shadow:0 4px 14px rgba(37,43,59,.05),0 1px 2px rgba(37,43,59,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#phone{max-width:440px;overflow-x:hidden;min-height:100vh;margin:0 auto;background:var(--paper);position:relative;display:flex;flex-direction:column}
@media(min-width:560px){
  body{padding:28px 0}
  #phone{min-height:calc(100vh - 56px);border:1px solid var(--edge);box-shadow:0 18px 50px rgba(37,43,59,.10)}
}
.mono{font-family:var(--mono)}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:6px;height:54px;padding:0 8px}
.top h1{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm)}
.iconbtn:active{background:var(--bg)}
.iconbtn svg{width:22px;height:22px}
.content{flex:1;padding:0 0 110px}
.pad{padding:18px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;width:100%;border:1px solid var(--edge);font-weight:700;font-size:16px;border-radius:var(--r-sm)}
.btn.black{background:var(--ink);color:#fff}
.btn.orange{background:var(--orange);color:var(--ink);border-color:var(--ink)}
.btn.ghost{background:#fff}
.btn:active{transform:translate(1px,1px)}
.btn svg{width:20px;height:20px}
.btn.sm{height:38px;font-size:14px;width:auto;padding:0 14px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border:1px solid var(--edge);border-radius:var(--r-sm);letter-spacing:.04em;vertical-align:middle}
.tag.o{background:var(--orange);}
.tag.g{border-color:var(--line2);color:var(--muted)}
.bottom{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--edge);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5;margin-top:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;font-size:15px;border-radius:var(--r-sm);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--orange)}

/* login */
.login{flex:1;display:flex;flex-direction:column;padding:28px 22px 26px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:var(--orange);border:1px solid var(--edge);display:grid;place-items:center}
.logo-mark svg{width:20px;height:20px}
.logo b{font-size:20px;letter-spacing:-.02em}
.hero{margin-top:auto;margin-bottom:28px}
.hero h2{font-size:34px;line-height:1.18;letter-spacing:-.03em;font-weight:700}
.hero h2 em{font-style:normal;background:var(--orange);padding:0 4px}
.hero p{margin-top:14px;color:var(--muted);font-size:16px;line-height:1.6}
.invite{border:1px dashed var(--line2);padding:12px 14px;margin-bottom:14px;font-size:15px;line-height:1.5}
.invite .label{margin-bottom:4px}
.gbtn{background:#fff}
.gdot{width:20px;height:20px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.authbox{margin-bottom:14px}
.authtabs{display:flex;gap:6px;margin-bottom:4px}
.authtabs button{flex:1;height:40px;border:1px solid var(--edge);border-radius:var(--r-sm);background:#fff;font:inherit;font-size:15px;color:var(--muted)}
.authtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.authbox .gf{padding:12px 0 0}
.autherr{min-height:20px;margin-top:10px;font-size:14px;color:var(--danger)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2DB36A;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(45,179,106,.18)}

/* lists */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 8px}
.card{display:block;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:16px 18px}
.card:active{background:var(--bg)}
.card .t{font-weight:700;font-size:16px}
.card .s{color:var(--muted);font-size:14px;margin-top:4px}
.bar{height:6px;border:1px solid var(--edge);margin-top:10px;position:relative;background:#fff}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--orange)}
.members{display:flex;align-items:center;gap:0;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font-size:12px;letter-spacing:-.04em;font-weight:700;background:#fff;margin-right:-6px}
.av.me{background:var(--orange)}
.members span.txt{margin-left:16px;font-size:14px;color:var(--muted);flex:1}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}
.empty .big{width:56px;height:56px;margin:0 auto 14px;border:1.5px dashed var(--line2);display:grid;place-items:center}

/* experiment */
.exp-head{padding:16px 18px 14px;border-bottom:1px solid var(--edge)}
.exp-head .t{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.exp-head .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px}
.tabs{display:flex;border-bottom:1px solid var(--edge)}
.tabs button{flex:1;height:44px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
.secname{padding:16px 18px 6px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;background:var(--bg);border-bottom:1px solid var(--line)}
.step{display:flex;gap:12px;padding:14px 14px 14px 18px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.step:active{background:var(--orange-soft)}
.step .no{font-family:var(--mono);font-weight:600;font-size:14px;width:26px;flex:none;padding-top:2px}
.step.done .no{color:var(--orange)}
.step .body{flex:1;min-width:0}
.step .t{font-weight:700;font-size:16px}
.step .d{color:var(--muted);font-size:14px;line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.thumbs img{width:44px;height:44px;object-fit:cover;border:1px solid var(--edge)}
.thumbs .more{width:44px;height:44px;border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.step .side{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.shot{width:46px;height:46px;border:1px solid var(--edge);background:var(--orange);display:grid;place-items:center;border-radius:50%}
.shot svg{width:22px;height:22px}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.more-link{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:2px}
.hint{margin:14px 18px;padding:10px 12px;background:var(--orange-soft);border-left:3px solid var(--orange);font-size:14px;line-height:1.5}

/* step detail */
.instr{padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 18px}
.ph{border:1px solid var(--edge);background:#fff;display:flex;flex-direction:column;min-width:0}
.ph.new{outline:3px solid var(--orange);outline-offset:2px}
.ph img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block;border-bottom:1px solid var(--edge);cursor:zoom-in}
.ph .meta{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 0;font-size:12px}
.ph .meta b{font-size:13px}
.ph .meta .mono{color:var(--muted);font-size:11px}
.ph input{min-width:0;border:0;border-bottom:1px solid var(--line);margin:4px 8px 8px;padding:6px 0;font-size:14px;outline:none;background:transparent}
.ph input:focus{border-bottom-color:var(--orange)}
.ph .del{font-size:12px;color:var(--muted);padding:0 8px 8px;text-align:left}
.ph .del.arm{color:var(--danger);font-weight:700}
.addph{border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;font-size:14px;color:var(--muted)}
.addph svg{width:26px;height:26px}
.obs{padding:4px 18px 20px}
.obs textarea{width:100%;min-height:96px;border:1px solid var(--edge);padding:12px;font-size:15px;line-height:1.6;resize:vertical;outline:none;border-radius:var(--r-sm);margin-top:8px}
.obs textarea:focus{box-shadow:0 0 0 3px var(--orange-soft)}
.obs .by{font-size:13px;color:var(--muted);margin-top:6px}

/* result */
.rs-step{padding:16px 18px;border-bottom:1px solid var(--line)}
.rs-step .h{display:flex;gap:10px;align-items:baseline}
.rs-step .h .mono{font-weight:600;color:var(--orange);font-size:14px}
.rs-step .h b{font-size:16px}
.rs-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.rs-photos figure{border:1px solid var(--line2)}
.rs-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.rs-photos figcaption{font-size:12px;padding:5px 6px;line-height:1.45}
.rs-photos figcaption span{color:var(--muted)}
.rs-obs{margin-top:10px;padding:8px 10px;border-left:3px solid var(--orange);background:var(--orange-soft);font-size:14px;line-height:1.55}
.rs-none{margin-top:8px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--edge)}
.stats div{padding:14px 10px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--mono);font-size:22px}
.stats span{font-size:12px;color:var(--muted)}

/* editor */
.ed{border-bottom:1px solid var(--line);padding:12px 14px 12px 18px;display:flex;gap:10px}
.ed .no{font-family:var(--mono);font-weight:600;font-size:14px;width:24px;padding-top:9px;flex:none}
.ed .f{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ed input,.ed textarea{width:100%;border:1px solid var(--line2);padding:8px 10px;font-size:15px;border-radius:var(--r-sm);outline:none;background:#fff}
.ed input{font-weight:700}
.ed textarea{font-size:14px;color:#333;min-height:56px;resize:vertical;line-height:1.5}
.ed input:focus,.ed textarea:focus{border-color:var(--ink)}
.ed .ctl{display:flex;flex-direction:column;gap:2px;flex:none}
.ed .ctl button{width:32px;height:30px;border:1px solid var(--line2);font-size:14px;display:grid;place-items:center;border-radius:var(--r-sm)}
.ed .ctl button:disabled{opacity:.3}
.ed .ctl button.x{color:var(--danger)}
.ed-sec{display:flex;align-items:center;gap:8px;padding:12px 18px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.ed-sec input{flex:1;border:0;background:transparent;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;outline:none;padding:4px 0;border-bottom:1px dashed var(--line2)}

/* upload */
.drop{margin:18px;border:1.5px dashed var(--line2);padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer}
.drop svg{width:34px;height:34px}
.drop b{font-size:16px}
.drop span{font-size:14px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;margin:0 18px;color:var(--muted);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.ext{padding:60px 24px;text-align:center}
.ext .file{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--edge);padding:8px 12px;font-size:14px;max-width:100%}
.ext .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan{height:4px;background:var(--line);margin:22px auto 12px;max-width:240px;position:relative;overflow:hidden}
.scan i{position:absolute;top:0;bottom:0;width:40%;background:var(--orange);animation:scan 1s infinite ease-in-out}
@keyframes scan{0%{left:-40%}100%{left:100%}}
.ext p{font-size:15px;color:var(--muted)}

/* members */
.mem{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.mem .av{margin:0;width:36px;height:36px}
.mem .n{flex:1}
.mem .n b{font-size:16px}
.mem .n div{font-size:13px;color:var(--muted)}
.linkbox{margin:16px 18px;border:1px solid var(--edge)}
.linkbox .u{padding:14px;font-family:var(--mono);font-size:15px;word-break:break-all;border-bottom:1px solid var(--edge);background:var(--bg)}
.linkbox .r{display:flex}
.linkbox .r button{flex:1;height:44px;font-weight:700;font-size:14px}
.linkbox .r button+button{border-left:1px solid var(--edge)}
.linkbox .r button.o{background:var(--orange)}

/* viewer */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 16px;font-size:14px}
.viewer .vb button{color:#fff;font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:440px;border-top:1px solid var(--edge);padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:6px}
.sheet p{font-size:15px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.sheet input{width:100%;border:1px solid var(--edge);height:46px;padding:0 12px;font-size:16px;margin-bottom:12px;border-radius:var(--r-sm);outline:none}
.sheet .row{display:flex;gap:8px}
.mini{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}

/* 결과 분석 (갭맵 이식) */
.gsub{display:flex;border-bottom:1px solid var(--edge);background:var(--bg)}
.gsub button{flex:1;height:40px;font-size:12.5px;letter-spacing:-.02em;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.gsub button:last-child{border-right:0}
.gsub button.on{background:var(--ink);color:#fff}
.gf{padding:14px 18px 0}
.gf .label{display:block;margin-bottom:6px}
.gf input,.gf select,.gf textarea,.grole select{width:100%;border:1px solid var(--edge);border-radius:var(--r-sm);background:#fff;font:inherit;font-size:15px;color:var(--ink);padding:0 10px;height:44px;outline:none}
.gf textarea{height:auto;min-height:120px;padding:10px;line-height:1.5;font-family:var(--mono);font-size:13px;resize:vertical}
.gf textarea.txt{font-family:var(--sans);font-size:15px;min-height:96px}
.gf input:focus,.gf select:focus,.gf textarea:focus{box-shadow:0 0 0 3px var(--orange-soft)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.g2 .gf{padding-left:0;padding-right:0}
.gpad{padding:0 18px}
.grow{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.grow .btn{flex:1;min-width:120px}
.grole{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.grole .n{flex:1;min-width:0}
.grole .n b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grole .n span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grole select{width:112px;flex:none;height:40px;font-size:14px}
.gscroll{overflow-x:auto;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);margin-top:14px}
.gt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.gt th,.gt td{padding:9px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.gt tbody tr:last-child>*{border-bottom:0}
.gt thead th{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);background:var(--bg);font-weight:600;border-bottom:1px solid var(--edge)}
.gt td:first-child,.gt thead th:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;z-index:1}
.gt thead th:first-child{background:var(--bg)}
.gt tr.base td{background:var(--bg)}
.gt td.diff{background:var(--orange-soft);font-weight:700}
.gt td.cur{font-weight:700}
.gt td.mu{color:var(--muted)}
.gt td.wrap{white-space:normal;text-align:left;min-width:150px}
.gt .x{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.dn{color:var(--danger);font-weight:700}.upv{font-weight:700}
.flag{color:var(--danger);font-weight:700}
.gleg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:12px 18px 0}
.gleg i{display:inline-block;width:14px;height:14px;border:1px solid var(--edge);margin-right:5px;vertical-align:-2px}
.gleg .l-diff{background:var(--orange-soft)}.gleg .l-base{background:var(--bg)}
.gleg .l-gap{background:repeating-linear-gradient(135deg,var(--orange-soft) 0 4px,#fff 4px 8px)}
.gleg .l-plan{background:var(--orange)}
.gmap th,.gmap td{border-right:1px solid var(--line)}
.gmap tr>*:last-child{border-right:0}
.gmap thead th,.gmap thead th:first-child{text-align:center;position:static}
.gmap tbody th{background:var(--bg);font-family:var(--mono);font-size:14px;position:sticky;left:0}
.gmap td,.gmap td:first-child{min-width:92px;height:70px;text-align:center;font-weight:400;position:static;background:#fff}
.gmap td b{display:block;font-family:var(--mono);font-size:18px;line-height:1.25}
.gmap td b.none{font-family:var(--sans);font-size:15px;color:var(--muted)}
.gmap td span{display:block;font-size:12px;color:var(--muted);white-space:normal}
.gmap td span.lit{color:var(--ink);font-weight:700}
.gmap td.gap{background:repeating-linear-gradient(135deg,var(--orange-soft) 0 8px,#fff 8px 16px);font-weight:700}
.gmap td.plan{background:var(--orange);font-weight:700}
.gmap td.plan span{color:var(--ink)}
.gh{padding:20px 18px 0;font-size:16px;font-weight:700}
.gnext{list-style:none;counter-reset:n}
.gnext li{counter-increment:n;display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.gnext li:before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-weight:600;color:var(--orange)}
.gnext li div{flex:1}
.gnext li div span{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--edge);border-radius:var(--r-sm);padding:3px 4px 3px 8px;font-size:13px}

.gnote{font-size:13px;color:var(--muted);line-height:1.6;padding:10px 18px 0}
.gintro{padding:16px 18px 0;font-size:14px;line-height:1.6;color:#333}

.gpick{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}

.gcard{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--line)}

.gcard .ic.up{background:var(--orange)}.gcard .ic.dn{background:var(--ink);color:#fff}
.gcard .t{font-size:16px;font-weight:700;line-height:1.35}
.gcard .d{font-size:14px;color:#333;line-height:1.55;margin-top:2px}
.gcard .d b{font-family:var(--mono)}
.gcard .s{font-size:13px;color:var(--muted);margin-top:2px}
.gcard .btn{flex:none;align-self:center}
.gacc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
.gacc div{flex:1}.gacc b{display:block;font-size:16px}.gacc span{display:block;font-size:13px;color:var(--muted);margin-top:1px}

.gacc.on{background:var(--bg);border-bottom-color:var(--ink)}
.gaccb{border-bottom:1px solid var(--edge);padding-bottom:22px}
.mrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mono{font-size:14px;font-weight:600}
.msrc{display:flex;margin:14px 18px 0;border:1px solid var(--edge)}
.msrc button{flex:1;height:42px;font-size:14px;font-weight:700}
.msrc button+button{border-left:1px solid var(--edge)}
.msrc button.on{background:var(--orange)}
.rs-meas{margin-top:8px;font-size:13px;line-height:1.7}
.rs-meas .mono{font-weight:600}
.mg .gt td{padding:5px 6px;white-space:nowrap}
.mg .gt th{position:relative;padding:8px 22px 8px 10px;line-height:1.3;text-transform:none}
.mg .gt th .x{position:absolute;right:5px;top:6px;text-decoration:none;font-size:16px;line-height:1}
.mg .gt th small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.mv{width:78px;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;padding:0 4px;background:#fff;color:var(--ink);outline:none}
.mn{width:112px;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);padding:0 8px;font:inherit;font-size:14px;font-weight:700;background:#fff;color:var(--ink);outline:none}
.mv:focus,.mn:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--orange-soft)}
.mv[readonly]{background:var(--bg);border-style:dashed}
.mg .x.rowx{font-size:16px;text-decoration:none;margin-left:4px;padding:6px 4px}
.mcalc{margin-top:12px;border:1px solid var(--line2);padding:2px 12px 14px}
.mcalc select{width:100%;border:1px solid var(--edge);border-radius:var(--r-sm);background:#fff;font:inherit;font-size:15px;height:44px;padding:0 8px}
.rpst{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.rpst span{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--edge);padding:3px 8px}
.rpst span.ok{background:var(--ink);color:#fff}
.rpst span.no{border-style:dashed;color:var(--muted)}
.addrow{margin-top:8px}
.gcard .add{font-size:13px;font-weight:700;border:1px solid var(--edge);border-radius:var(--r-sm);padding:7px 9px;background:#fff}
.gcard .add[disabled]{border-style:dashed;color:var(--muted)}
.gwarn{margin:14px 18px 0;padding:10px 12px;border:1px solid var(--danger);font-size:14px;line-height:1.5}

/* ===== 부드럽고 단정한 모양새 ===== */

.gh{font-weight:600}
.gpick button{border-radius:99px;padding:7px 13px;border-color:var(--line2);font-weight:500;color:var(--ink)}

.gcard{padding:15px 18px}
.gcard .ic{border:0;border-radius:var(--r);background:var(--bg);color:var(--muted)}

.chip{border-radius:99px;border-color:var(--line2);padding:4px 6px 4px 11px}
.gwarn{border-radius:var(--r);border-color:var(--danger);background:#FBF1F0}

.gf textarea{height:auto;font-size:14px}
.gf textarea.txt{font-size:15.5px}
.gf input:focus,.gf select:focus,.gf textarea:focus,.sheet input:focus{background:#fff;border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.aibox .gf input{background:#fff}
.mv,.mn{border-radius:11px;font-family:var(--sans);font-weight:700}
/* 결과 모아보기 */
.stats{margin:14px 16px 0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.stats b{font-size:26px}
.rs-step{border-bottom:0;padding:14px 20px}
.rs-photos figure{border-radius:14px;border-color:var(--line)}
.rs-obs{border-radius:14px;background:var(--bg)}
.rpst{border-bottom:0;padding:14px 16px 2px}
.rpst span{border:0;background:var(--bg);color:var(--muted);font-size:13px;padding:5px 12px}
.rpst span.ok{background:var(--orange-soft);color:var(--accent-ink)}
.rpst span.no{background:var(--bg);color:var(--muted)}
/* 결과 분석 */
.gintro{padding:20px 20px 0;font-size:15px}
.gintro b{font-size:22px;line-height:1.35}
.gh{padding:26px 20px 0;font-size:18px}
.gnote{padding:8px 20px 0;font-size:14px}
.gpick{padding:12px 16px 0}
.gpick button{border:0;background:var(--bg);font-size:15px;padding:9px 15px}
.gpick button.on{background:var(--orange);color:#fff}
.gcards{margin-top:6px}
.gcard{margin:8px 16px;padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.gcard .ic{width:42px;height:42px;border-radius:14px}
.gcard .t{font-size:17.5px}
.gcard .d{font-size:15px}
.gcard .s{font-size:13.5px}
.gcard .add{font-family:var(--round);font-weight:400;font-size:14px;border:0;background:var(--orange-soft);color:var(--accent-ink);padding:8px 14px}
.gcard .add[disabled]{background:var(--bg);color:var(--muted)}
.gscroll{margin:12px 16px 0;border:1px solid var(--line);border-radius:18px;background:#fff}
.gscroll.mg{border-radius:0}
.gt{font-size:15px}
.gt thead th{font-size:13px;background:var(--bg);border-bottom-color:var(--line)}
.gacc{margin:8px 16px 0;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.gacc b{font-size:17px}
.gacc span{font-size:13.5px}
.gacc.on{background:var(--orange-soft);border-color:transparent;box-shadow:none}
.gacc.on i{background:#fff;color:var(--accent-ink)}
.gaccb{border-bottom:0;background:none;padding-bottom:10px}
.aibox{margin:14px 16px 0;border-radius:22px;padding:18px}
.aibox .t{font-size:19px}
.aiprov{border:0;padding:4px;gap:4px;border-radius:15px}
.aiprov button{border:0!important;border-radius:11px;height:40px;font-size:15px}
.msrc{margin:14px 16px 0;border:0;padding:4px;gap:4px;background:var(--bg);border-radius:16px}
.msrc button{border:0!important;border-radius:12px;height:40px;font-size:14.5px;color:var(--muted)}
.msrc button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(37,43,59,.14)}
.aisteps li:before{font-family:var(--round);font-weight:400;font-size:13px}
.aiprompt{border-radius:16px}
.drop{border:1.5px dashed #C3CAF3;border-radius:22px;background:var(--orange-soft);color:var(--accent-ink)}
.chip{border:0;background:var(--bg)}
.sheet{border-radius:28px 28px 0 0;padding-top:26px}
.sheet h3{font-size:21px}
.mem{padding:14px 20px}
.gwarn{border:0;border-radius:16px;background:#FBEFEE}
@media(min-width:560px){#phone{border:0;border-radius:32px;box-shadow:0 24px 60px rgba(37,43,59,.12)}}
</style>
</head>

<script>
/* ---------- icons ---------- */
const I={

 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
 flask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4A1.5 1.5 0 0 0 19 19l-5-10V3"/><path d="M7.5 14h9"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
 users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
 edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
 img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>'
};

/* ---------- data ---------- */
let ME='나'; // 지금 쓰는 사람의 이름. Claude 계정에서 가져오거나 첫 화면에서 직접 적음
// 팀에서 기록을 남긴 사람들: 나 + 사진·메모·측정값에 이름이 남은 사람
function people(t){const out=[ME],add=n=>{if(n&&!out.includes(n))out.push(n)};
  (t?t.experiments:[]).forEach(e=>e.steps.forEach(q=>{q.photos.forEach(ph=>add(ph.by));if(q.obs)add(q.obs.by);(q.meas||[]).forEach(m=>add(m.by))}));
  return out.map(n=>({name:n,me:n===ME}))}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`};
const code=()=>Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

// 수업 자료(실험 4 MOF-5 PPT)에서 추출된 것으로 보여줄 단계
const EXTRACT={
  no:'실험 4', title:'MOF-5 합성 및 분석', course:'무기화학실험',
  goal:'아연(II) 이온과 테레프탈산의 반응으로 미세 다공성 배위 고분자 MOF-5를 합성하고 물성을 분석한다.',
  theory:'MOF(Metal-organic Framework)는 금속 이온이나 금속 뭉치가 배위 결합을 통해 다리 리간드로 연결된 고체 화합물이다. MOF-5는 Zn(II) 이온과 테레프탈산(H₂BDC)이 반응하여 Zn₄O(BDC)₃ 조성을 갖는 전하 중성의 결정성 고체로 얻어진다.\n용매열 반응은 유기 용매 속에서 고온·고압으로 반응물을 결합시켜 결정 구조를 만드는 방법이다.\nPXRD는 Bragg 법칙(nλ = 2d sinθ)을 만족할 때 생기는 회절 패턴으로 결정 구조를 확인하고, TGA는 온도에 따른 질량 변화로 손님 분자의 휘발 온도와 골격의 분해 온도를 확인한다.',
  steps:[
   ['A. MOF-5 합성','시약 넣고 녹이기','Zn(NO₃)₂·6H₂O 0.446 g과 테레프탈산 0.25 g을 30 mL 바이알에 넣고 NMP 15 mL에 녹인다.'],
   ['A. MOF-5 합성','바이알 밀봉','바이알 뚜껑을 잘 닫고, 이음새 부분을 테플론 테이프로 감싸서 밀봉한다.'],
   ['A. MOF-5 합성','오븐 가열','온도가 100 ℃로 고정된 오븐에 바이알을 넣고 하루 동안 가열한다.'],
   ['A. MOF-5 합성','상온 냉각 · 결정 확인','반응 후 반응 용액을 상온에서 식힌다. 결정이 반응 용기 벽면에 생성된 것을 확인한다.'],
   ['A. MOF-5 합성','코니칼 튜브로 옮겨 세척','합성한 MOF-5를 코니칼 튜브에 넣고 wash 한다.'],
   ['B. MOF 분석','PXRD 측정','분말 X-선 회절법(PXRD)으로 합성한 MOF의 회절 패턴을 분석한다. (2층 XRD실 212호)'],
   ['B. MOF 분석','TGA 측정','TGA로 손님 분자의 휘발 온도, 골격의 분해 온도, ZnO의 양을 확인한다.'],
   ['B. MOF 분석','77 K N₂ 흡착 분석','77 K N₂ 흡착 분석으로 합성된 MOF의 표면적과 기공 크기 등을 확인한다.']
  ]
};

// 수업 자료(실험 3 코발트 착물 PPT)의 "실험 방법"에서 추출된 것으로 보여줄 단계
const EXTRACT3={
  no:'실험 3', title:'코발트 착물의 입체 화학', course:'무기화학실험',
  goal:'다양한 농도의 코발트 착물을 준비하고 용액의 색을 확인한다. 코발트 착물의 UV-vis 흡수 스펙트럼 비교를 통해 CFT를 이해한다.',
  theory:'결정장 이론(CFT)에서는 리간드가 만드는 장 때문에 d 오비탈의 에너지가 갈라진다. 팔면체(Δo)와 사면체(Δt)는 갈라지는 방식과 크기가 다르다.\n[Co(H₂O)₆]²⁺(팔면체)의 λmax는 약 510 nm이고, SCN⁻이 배위하여 사면체 착물이 되면 λmax가 약 610 nm로 나타난다.\n전자 전이의 세기는 스핀 선택 규칙(ΔS = 0)과 Laporte 선택 규칙(g ↔ u)의 영향을 받는다. 수업 자료에 따르면 d–d 전이의 ε은 팔면체에서 약 10~50, 사면체에서 약 500이다.',
  steps:[
   ['A. 용액 준비','0.3 M 코발트 수용액 만들기','Co(NO₃)₂·6H₂O, 3차 증류수, 50 mL 부피 플라스크를 사용하여 0.3 M 코발트 수용액 50 mL를 만든다.'],
   ['A. 용액 준비','0.1 M 코발트 수용액 만들기','0.3 M 코발트 수용액 20 mL를 바이알에 덜고, 남은 용액을 묽혀 0.1 M 코발트 수용액을 100 mL 비커에 만든다.'],
   ['A. 용액 준비','3 M KSCN 수용액 만들기','KSCN, 3차 증류수, 50 mL 부피 플라스크를 사용하여 3 M KSCN 수용액 50 mL를 만든다.'],
   ['A. 용액 준비','혼합 용액 3가지 만들기','0.1 M 코발트 수용액(5 mL)과 3 M KSCN 수용액(각각 5 mL, 10 mL, 15 mL)을 20 mL 바이알에 넣고 섞어서 3가지 혼합 용액을 만든다.'],
   ['B. UV-Vis 측정','흡수 스펙트럼 측정','0.3 M, 0.1 M 코발트 수용액 2가지와 혼합 용액 3가지, 총 5가지 용액에 대한 UV-Vis 흡수 스펙트럼을 측정한다.'],
   ['B. UV-Vis 측정','농도에 따른 흡광도 확인','착물의 농도에 따른 흡광도 차이를 확인한다.'],
   ['B. UV-Vis 측정','혼합 비율에 따른 변화 관찰','혼합물의 양에 따른 UV-Vis 흡수 스펙트럼 변화를 관찰한다.']
  ]
};

const EXTRACT1={
  no:'실험 1', title:'Cucurbit[6]uril의 합성 및 금속 이온과의 반응', course:'무기화학실험',
  goal:'내부에 손님 분자를 가둘 수 있는 공간이 있으며 금속 이온과 배위 결합을 할 수 있는 쿠커비투릴을 합성하고, 금속 이온과의 착물을 형성시킨다.',
  theory:'초분자 화학은 비공유 결합 상호작용으로 만들어지는 초분자를 다룬다. Cucurbit[n]uril(CB[n])은 글리콜우릴 단위가 고리로 이어진 주인(host) 분자로, 안쪽은 소수성 공간이고 입구에서는 양이온과 이온–쌍극자 상호작용을 한다. CB[6]의 입구 지름은 3.9 Å, 안쪽 지름은 5.8 Å, 높이는 9.1 Å이다.\n반응식: 1 Glyoxal + 2 Urea → 1 Glycoluril, 6 Glycoluril + 12 Formaldehyde → 1 Cucurbit[6]uril.',
  steps:[
   ['A-1. Glycoluril 합성','시약 준비','Glyoxal 10.0 mL(87.2 mmol)와 Urea 13.7 g(227 mmol)을 준비한다.'],
   ['A-1. Glycoluril 합성','가열 교반','Glyoxal과 Urea를 100 mL 삼각 플라스크에 차례로 넣고 80 ℃에서 20분 동안 교반한다. (Urea가 점점 녹으며 투명해짐)'],
   ['A-1. Glycoluril 합성','HCl 첨가','Urea가 완전히 녹으면 HCl 1 mL를 피펫으로 첨가한 후 80 ℃에서 40분 이상 교반한다.'],
   ['A-1. Glycoluril 합성','여과 · 건조 · 무게 측정','하얀색 침전물이 많이 생성되면 가열을 멈추고 상온에서 식힌다. 감압 여과로 거르고 3차 증류수로 씻은 뒤, 오븐에서 건조하고 무게를 측정한다.'],
   ['A-2. Cucurbit[6]uril 합성','시약 넣기','합성한 Glycoluril 2.0 g과 Formaldehyde 2.5 mL를 100 mL 비커에 순서대로 넣고 1 M HCl 용액 1 mL를 첨가한다.'],
   ['A-2. Cucurbit[6]uril 합성','가열 · 황산 첨가','80 ℃ 핫플레이트에서 가열하면서 유리 막대로 잘 저어 준다. 용액이 젤 형태가 되면 H₂SO₄ 5 mL를 천천히 dropwise한다. (황산 사용 시 보안경 착용)'],
   ['A-2. Cucurbit[6]uril 합성','일주일 교반','마그네틱 바를 넣고 80 ℃에서 일주일간 교반한다. (진한 갈색 용액으로 변했다가 서서히 침전물 생성)'],
   ['A-2. Cucurbit[6]uril 합성','침전 · 여과 · 건조','반응 용액을 상온으로 식힌 뒤 3차 증류수 200 mL가 담긴 500 mL 비커에 천천히 부어 침전을 만든다. 아세톤을 과량 첨가한 후 감압 여과하고, 3차 증류수로 충분히 씻어 산을 제거한 뒤 건조한다.'],
   ['B. 금속 이온과의 반응','무게 측정 · 시약 준비','건조된 Cucurbit[6]uril의 무게를 측정하고 수득률을 계산한다. Cucurbit[6]uril 100 mg, 3차 증류수 20 mL, Na₂SO₄ 7 mg을 준비한다.'],
   ['B. 금속 이온과의 반응','1시간 교반','100 mL 삼각 플라스크에 Cucurbit[6]uril과 Na₂SO₄를 넣고 3차 증류수를 첨가한 후 1시간 동안 교반한다.'],
   ['B. 금속 이온과의 반응','침전 · 여과 · 건조','용액에 아세톤을 과량 첨가해 침전을 형성시킨다. 감압 여과로 침전을 거른 다음 아세톤으로 씻은 후 상온 건조한다.']
  ]
};
const EXTRACT2={
  no:'실험 2', title:'헤모글로빈 모델 화합물의 합성', course:'무기화학실험',
  goal:'금속을 포함하는 생화학적 시스템에서 관찰되는 가역적 산소 결합 반응과 유사한 기능을 수행하는 코발트 착물을 합성한다. 적외선 분광법(IR spectroscopy)으로 합성한 코발트 착물을 분석한다.',
  theory:'Salicylaldehyde 2분자와 Ethylenediamine 1분자가 축합 반응(−2H₂O)하여 Schiff base 리간드인 H₂salen을 만든다. H₂salen이 Co²⁺에 배위하면 Co(salen)(Salcomine)이 된다.\nCo(salen)에는 공기 중의 산소와 반응하는 활성형(갈색)과 특정 조건에서만 산소와 반응하는 불활성형(짙은 붉은색)이 있다. 이 실험은 일반 대기 조건에서 진행한다.\nIR 분광법에서는 작용기마다 신축 진동의 위치가 다르다. 수업 자료의 표에 따르면 C=O는 1850–1650 cm⁻¹, O–H는 3600–3200 cm⁻¹, C–O는 1300–900 cm⁻¹에 나타난다.',
  steps:[
   ['A. H₂salen 합성','시약 준비','메스 실린더로 Salicylaldehyde 3.4 mL, Ethylenediamine 1.1 mL, Ethyl Alcohol 50 mL를 준비한다. (두 시약은 닿으면 바로 반응하므로 메스 실린더는 반드시 따로 사용한다.)'],
   ['A. H₂salen 합성','혼합 · 가열 교반','100 mL 삼각 플라스크에 Ethyl Alcohol을 먼저 넣은 후 나머지 시약들을 첨가하고, 50 ℃로 가열하며 5~10분간 교반한다.'],
   ['A. H₂salen 합성','냉각','가열을 중단하고 5분간 용액을 상온에서 식힌 뒤, 얼음물에 플라스크를 담가 차갑게 식힌다. (노란색 침전물 형성)'],
   ['A. H₂salen 합성','여과 · 건조 · 무게 측정','감압 여과(Ethanol washing)로 침전을 거른 다음 80 ℃ 오븐에서 10분 이상 건조한다. 수득률 계산을 위해 무게를 측정하고, IR 분석을 위한 시료를 소량 바이알에 담는다.'],
   ['B. Co(salen) 합성','환류 장치 설치','H₂salen 1.0 g, ethanol 30 mL, 마그네틱 바를 250 mL 3구 둥근 바닥 플라스크에 넣고 reflux관을 설치한 뒤 120 ℃에서 교반한다.'],
   ['B. Co(salen) 합성','코발트 용액 첨가','Co(OAc)₂·4H₂O 0.93 g을 증류수 5 mL에 녹인다. H₂salen이 녹으면 이 용액을 3 mL 주사기로 2~3번에 걸쳐 플라스크에 첨가한다.'],
   ['B. Co(salen) 합성','가열 교반 · 냉각','약 15분간 가열 교반 후 뭉친 생성물이 풀어지면, 10분간 차가운 물에서 플라스크를 냉각한다.'],
   ['B. Co(salen) 합성','여과 · 건조 · 무게 측정','감압 여과(Ethanol washing)로 침전을 거른다. 80 ℃ 오븐에서 30분 이상 건조하고 무게를 측정한 뒤, IR 분석을 위해 시료를 바이알에 담는다.'],
   ['C. IR 분석','IR 스펙트럼 확인','합성한 H₂salen과 Co(salen)의 IR 스펙트럼에서 작용기의 신호 위치를 확인한다.']
  ]
};

  open(){return new Promise(res=>{try{const r=indexedDB.open('labstep-demo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  get(){return new Promise(res=>{try{const t=this.db.transaction('kv').objectStore('kv').get('state');t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}})},
  put(v){try{this.db&&this.db.transaction('kv','readwrite').objectStore('kv').put(v,'state')}catch(e){}}

function editorHTML(steps){
  let out='',sec=null;
  steps.forEach((s,i)=>{

    area('concl','실험 결론','결과에서 알 수 있는 것',130)+(g?`<div class="grow" style="padding-top:8px"><button class="btn ghost sm" data-a="rpAuto" data-k="concl">계산 결과 넣기</button></div>`:'')+

/* ---------- sheet ---------- */
function sheet(html){const d=document.createElement('div');d.className='sheet-bg';d.innerHTML=`<div class="sheet">${html}</div>`;d.addEventListener('click',ev=>{if(ev.target===d)d.remove()});document.body.appendChild(d);return d}

/* ---------- images ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im)};im.onerror=rej;im.src=u})}
async function toDataURL(file,max=1600){
  const im=await loadImg(file);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(im.src);return c.toDataURL('image/jpeg',.82);
}
function samplePhoto(){ // 팀원 예시 사진(그림)
  const c=document.createElement('canvas');c.width=900;c.height=900;const x=c.getContext('2d');
  x.fillStyle='#EDEBE6';x.fillRect(0,0,900,900);
  x.strokeStyle='#999';x.lineWidth=2;for(let i=0;i<900;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(900,i+40);x.stroke()}
  x.fillStyle='#fff';x.fillRect(330,120,240,70);x.strokeStyle='#222';x.lineWidth=5;x.strokeRect(330,120,240,70);
  x.fillStyle='rgba(255,255,255,.55)';x.fillRect(320,190,260,520);
  x.fillStyle='#C2550E';x.fillRect(325,400,250,305);x.fillStyle='#E7C14A';x.fillRect(325,392,250,14);
  x.strokeRect(320,190,260,520);
  x.fillStyle='#222';x.font='600 34px "Gowun Dodum", sans-serif';x.fillText('예시 사진',340,800);
  return c.toDataURL('image/jpeg',.85);
}

async function addPhotos(files,sid){
  const e=exp();const s=e.steps.find(x=>x.id===sid);if(!s)return;
  let last=null;
  for(const f of files){try{const src=await toDataURL(f);last={id:uid(),src,by:ME,at:Date.now(),memo:''};s.photos.push(last)}catch(err){toast('이 사진은 열 수 없어요')}}
  if(!last)return;
  save();
  if(V.name==='step'&&V.sid===sid){V.newPid=last.id;V.focusNew=true;render()}
  else go({name:'step',tid:V.tid,eid:V.eid,sid,newPid:last.id,focusNew:true});
  toast(`<b>${esc(s.title)}</b>에 사진이 붙었어요`);
}

// 계정 로그인·회원가입 (서버의 ls_login / ls_signup)
let AUTH_BUSY=false;
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target&&e.target.id;if(!['lid','lpw','lpw2','lname'].includes(id))return;e.preventDefault();const su=V.name==='signup',last=su?'lname':'lpw';if(id===last)authGo(su);else{const nx={lid:'lpw',lpw:'lpw2',lpw2:'lname'}[id];const el=nx&&$('#'+nx);if(el)el.focus()}});
async function authGo(su){
  if(AUTH_BUSY)return;
  const v=id=>{const el=$('#'+id);return el?el.value:''},err=m=>{const e=$('#autherr');if(e)e.textContent=m};
  const id=v('lid').trim().toLowerCase(),pw=v('lpw');
  if(!id){$('#lid').focus();return err('아이디를 입력하세요')}
  if(!pw){$('#lpw').focus();return err('비밀번호를 입력하세요')}
  let name='';
  if(su){
    if(!/^[a-z0-9_]{3,20}$/.test(id)){$('#lid').focus();return err('아이디는 영문 소문자·숫자 3~20자로 적어 주세요')}
    if(pw.length<4){$('#lpw').focus();return err('비밀번호는 4자 이상이에요')}
    if(pw!==v('lpw2')){$('#lpw2').focus();return err('비밀번호 확인이 달라요')}
    name=v('lname').trim();if(!name){$('#lname').focus();return err('이름을 입력하세요')}
  }
  AUTH_BUSY=true;const b=$('#authbtn');if(b){b.disabled=true;b.textContent=su?'가입하는 중…':'확인하는 중…'}
  let u=null;
  try{u=su?await rpc('ls_signup',{p_id:id,p_pw:pw,p_name:name}):await rpc('ls_login',{p_id:id,p_pw:pw})}
  catch(e){AUTH_BUSY=false;if(b){b.disabled=false;b.textContent=su?'가입하고 시작하기':'로그인'}
    return err(su?'가입하지 못했어요 · 이미 있는 아이디일 수 있어요':'서버에 연결하지 못했어요 · 잠시 뒤 다시 시도하세요')}
  AUTH_BUSY=false;
  if(!u||!u.name){if(b){b.disabled=false;b.textContent='로그인'}return err('아이디 또는 비밀번호가 맞지 않아요')}
  S.me={name:u.name,id:u.id,src:'account'};ME=u.name;S.loggedIn=true;save();hist.length=0;
  if(PENDING&&SYNC.on){const c=PENDING;PENDING='';return joinByCode(c)}
  go({name:'teams'},false);toast(`<b>${esc(u.name)}</b> 님, ${su?'가입을 환영해요':'반가워요'}`);
}

/* ============================================================
   결과 분석 (갭맵 이식)
   실험마다 e.gap 에 저장: 조건 열, 결과 열, 실험 기록(rows), 계획, 선행연구, 목적·가설
   규칙 기반으로만 계산하고, 데이터는 다른 기록과 같이 이 폰 안에만 저장한다.
   ============================================================ */
const SEP='\u0001';
const defaultGap=()=>({conds:[],results:[],repLabel:'',rows:[],plans:[],refs:[],goal:'',curRes:null,better:'high'});
const G=()=>{const e=exp();if(!e.gap)e.gap=defaultGap();return e.gap};

/* --- 예시 표: 수업 자료의 6개 조 그래프에서 읽은 값 --- */
function sampleTable(e){
  if(e.no==='실험 1')return null; // 수업 자료에 여러 조의 결과가 없음
  if(e.no==='실험 2'){ // IR 스펙트럼에 적힌 피크 위치 (Co(salen)의 O–H는 표시가 없어 비워 둠)
    const L=['이름\t조\t화합물\tC=N (cm⁻¹)\tC–O (cm⁻¹)\tO–H (cm⁻¹)'],a=[[1634,1150,3433],[1637,1150,3440],[1637,1149,3440],[1633,1149,3444],[1632,1150,3436],[1636,1149,3433]],b=[[1629,1142],[1628,1141],[1628,1141],[1627,1141],[1627,1141],[1625,1141]];
    a.forEach((v,i)=>{L.push(`H₂salen-${i+1}\t${i+1}\tH₂salen\t${v[0]}\t${v[1]}\t${v[2]}`);L.push(`Co(salen)-${i+1}\t${i+1}\tCo(salen)\t${b[i][0]}\t${b[i][1]}\t`)});
    return L.join('\n');
  }
  if(e.no==='실험 3'){ // UV-vis 그래프에 적힌 λmax
    const b1=[[511,512,519,522,522],[511,512,520,521,523],[510,511,521,524,522],[511,512,519,521,522],[511,512,521,522,522],[510,512,519,521,523]];
    const b2=[[611,613,614],[611,614,615],[611,612,615],[611,614,615],[612,614,615],[612,614,615]];
    const sol=[['①','0.3','0'],['②','0.1','0'],['③','0.1','5'],['④','0.1','10'],['⑤','0.1','15']];
    const L=['이름\t조\tCo 원액 (M)\t3 M KSCN (mL)\t첫째 흡수띠 λmax (nm)\t둘째 흡수띠 λmax (nm)'];
    b1.forEach((r,g)=>sol.forEach((x,i)=>L.push([`${g+1}조-${x[0]}`,g+1,x[1],x[2],r[i],i<2?'없음':b2[g][i-2]].join('\t'))));
    return L.join('\n');
  }
  // PXRD 그래프에서 잰 9.7° 피크 / 6.9° 피크 높이 비
  const a=[40.9,69.4,49.9,24.5,198.5,25.2],w=[37.0,51.8,31.5,6.6,28.5,26.0];
  const L=['이름\t조\t세척\tI(9.7°)/I(6.9°) (%)'];
  a.forEach((v,i)=>{L.push(`assyn-${i+1}\t${i+1}\t전\t${v.toFixed(1)}`);L.push(`wash-${i+1}\t${i+1}\t후\t${w[i].toFixed(1)}`)});
  return L.join('\n');
}

/* --- 표 읽기 --- */
function splitCSV(line){const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out}
function parseTable(text){ // 탭(엑셀) / 세로선(마크다운) / 쉼표(CSV)
  let lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.some(l=>l.includes('\t'))){const md=lines.filter(l=>(l.match(/\|/g)||[]).length>=2);if(md.length>=2)lines=md} // AI의 답처럼 표 앞뒤에 글이 있으면 표 줄만 남김
  if(lines.length<2)return null;
  const split=lines[0].includes('\t')?l=>l.split('\t'):lines[0].includes('|')?l=>l.trim().replace(/^\||\|$/g,'').split('|'):splitCSV;
  const rows=lines.filter(l=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)).map(l=>split(l).map(c=>c.trim().replace(/^\*\*(.*)\*\*$/,'$1').replace(/^`(.*)`$/,'$1')));
  return {header:rows[0],rows:rows.slice(1)};
}
const NONE_RE=/^(–|—|-|없음|x|n\.?d\.?|none)$/i;
function parseCell(s){ // 숫자 / 없음(측정했지만 없음) / 빈칸(측정 안 함)
  s=(s??'').trim();if(s==='')return {v:null,miss:'blank'};if(NONE_RE.test(s))return {v:null,miss:'none'};
  const n=Number(s.replace(/,/g,''));if(isNaN(n))return {v:null,miss:'blank',bad:true};
  return {v:n,dp:(s.split('.')[1]||'').length};
}
const RESULT_RE=/수율|수득|yield|λ|흡광|absorb|ε|세기|intensity|결과|result|비율|ratio|피크|peak|\bnm\b|cm⁻¹|cm-1/i;
const ROLE={name:'이름',cond:'조건',result:'결과',rep:'반복 번호',note:'메모',skip:'무시'};
function guessRoles(h,rows){ // 열 역할 자동 추정 (화면에서 고칠 수 있음)
  const isNum=x=>x!==''&&!isNaN(Number(x.replace(/,/g,'')));let nameSet=false,repSet=false;
  return h.map((label,i)=>{
    const v=rows.map(r=>(r[i]??'').trim()).filter(x=>x!==''&&!NONE_RE.test(x));const uniq=new Set(v).size,num=v.length>0&&v.every(isNum);
    if(/메모|비고|note|comment/i.test(label))return 'note';
    if(!repSet&&/^(조|반복( 번호)?|회차|run|trial|rep(licate)?)$/i.test(label.trim())){repSet=true;return 'rep'}
    if(!nameSet&&!num&&uniq===rows.length&&(i===0||/이름|name|시료|sample/i.test(label))){nameSet=true;return 'name'}
    if(num&&(RESULT_RE.test(label)||i===h.length-1))return 'result';
    return 'cond';
  });
}

/* --- 계산 --- */
const gMean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const gMed=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const gKey=(g,x)=>g.conds.map(c=>x.cond[c.key]).join(SEP);
const gRes=g=>g.results.find(r=>r.key===g.curRes)||g.results[0];
function gVals(g,c){ // 기록된 값 + 직접 추가한 값. 숫자는 크기순, 글자는 처음 나온 순서
  const v=[...new Set(g.rows.map(e=>e.cond[c.key]).concat(c.extra||[]))];
  return v.every(x=>x!==''&&!isNaN(x))?v.sort((a,b)=>a-b):v;
}
const gAddExtra=(g,c,v)=>{if(!gVals(g,c).includes(v))c.extra=(c.extra||[]).concat(v)};
function gGroups(g){const m=new Map();g.rows.forEach(e=>{const k=gKey(g,e);if(!m.has(k))m.set(k,[]);m.get(k).push(e)});return m}
function gStat(list,r){
  const x=list.map(e=>e.res[r.key]).filter(v=>v!=null);const o={n:x.length,none:list.filter(e=>e.miss&&e.miss[r.key]==='none').length};
  if(x.length)o.mean=gMean(x);if(x.length>1)o.sd=Math.sqrt(x.reduce((a,v)=>a+(v-o.mean)**2,0)/(x.length-1));return o;
}
const gTotal=g=>g.conds.reduce((n,c)=>n*gVals(g,c).length,1);
function gFlags(g,r){ // 확인이 필요한 값: ① 같은 조건 4회 이상에서 수정 z-점수 > 3.5 ② 100 %를 넘는 수득률
  const f=new Map();
  if(g.conds.length)gGroups(g).forEach(list=>{const xs=list.filter(e=>e.res[r.key]!=null);if(xs.length<4)return;
    const v=xs.map(e=>e.res[r.key]),med=gMed(v),mad=gMed(v.map(x=>Math.abs(x-med)));
    if(mad>0)xs.forEach(e=>{if(.6745*Math.abs(e.res[r.key]-med)/mad>3.5)f.set(e.id,'같은 조건의 다른 값들과 크게 달라요')})});
  if(r.isYield)g.rows.forEach(e=>{if(e.res[r.key]>100)f.set(e.id,'100 %를 넘는 값이에요')});
  return f;
}
function gEffects(g,r){ // 조건 하나만 다른 묶음끼리 비교
  const gs=[...gGroups(g).values()].map(list=>({vals:list[0].cond,list}));
  const repM=list=>{const m=new Map();list.forEach(e=>{if(e.rep&&e.res[r.key]!=null){if(!m.has(e.rep))m.set(e.rep,[]);m.get(e.rep).push(e.res[r.key])}});m.forEach((v,k)=>m.set(k,gMean(v)));return m};
  const out=[];
  for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){
    const d=g.conds.filter(c=>gs[i].vals[c.key]!==gs[j].vals[c.key]);if(d.length!==1)continue;
    const c=d[0],ord=gVals(g,c);let a=gs[i],b=gs[j];if(ord.indexOf(a.vals[c.key])>ord.indexOf(b.vals[c.key]))[a,b]=[b,a];
    const sa=gStat(a.list,r),sb=gStat(b.list,r);if(!sa.n||!sb.n)continue;
    const ra=repM(a.list),rb=repM(b.list),com=[...ra.keys()].filter(k=>rb.has(k));let paired=null;
    if(com.length>1){const df=com.map(k=>rb.get(k)-ra.get(k));paired={n:df.length,up:df.filter(x=>x>0).length,down:df.filter(x=>x<0).length}}
    out.push({cond:c,from:a.vals[c.key],to:b.vals[c.key],delta:sb.mean-sa.mean,meanA:sa.mean,meanB:sb.mean,sdA:sa.sd,sdB:sb.sd,nA:sa.n,nB:sb.n,paired,
      others:g.conds.filter(x=>x!==c).map(x=>`${x.label} ${a.vals[x.key]}`).join(', '),
      so:[g.conds.indexOf(c),ord.indexOf(a.vals[c.key]),ord.indexOf(b.vals[c.key])]});
  }
  return out.sort((p,q)=>p.so[0]-q.so[0]||p.others.localeCompare(q.others,'ko')||p.so[1]-q.so[1]||p.so[2]-q.so[2]);
}
function gRank(g,r){ // 미실행 조합 순위: 조건 하나만 한 단계 다른 이웃 칸들의 평균이 좋은 순서
  const none={ranked:[],byKey:new Map()};if(!g.conds.length||gTotal(g)>3000)return none;
  const gm=gGroups(g),lists=g.conds.map(c=>gVals(g,c)),gaps=[];
  (function walk(d,cur){
    if(d===g.conds.length){const key=cur.join(SEP);if(gm.has(key))return;const nb=[];
      g.conds.forEach((c,ci)=>{const p=lists[ci].indexOf(cur[ci]);[-1,1].forEach(st=>{const v=lists[ci][p+st];if(v===undefined)return;
        const q=gm.get(cur.map((x,xi)=>xi===ci?v:x).join(SEP));if(q){const s=gStat(q,r);if(s.n)nb.push(s.mean)}})});
      gaps.push({key,vals:cur.slice(),score:nb.length?gMean(nb):null});return}
    lists[d].forEach(v=>{cur[d]=v;walk(d+1,cur)});
  })(0,[]);
  const ranked=gaps.filter(x=>x.score!==null).sort((p,q)=>g.better==='high'?q.score-p.score:p.score-q.score);
  ranked.forEach((x,i)=>x.rank=i+1);return {ranked,byKey:new Map(gaps.map(x=>[x.key,x]))};
}

/* --- 요약 · 분류 · 그래프 --- */
// 보고서 글: 예전에 만든 실험에는 report가 없으므로 처음 열 때 만들어 줌
const RP=()=>{const e=exp();if(!e.report){const src=SAMPLES.map(q=>q.data).find(x=>x.no===e.no&&x.title===e.title);e.report={goal:src?src.goal:'',theory:src?src.theory:'',concl:'',disc:''}}return e.report};
function gSummary(g,r){ // 조건 조합별 요약, 조건 값 순서대로
  const ord=g.conds.map(c=>gVals(g,c));
  return [...gGroups(g).values()].map(list=>{const xs=list.filter(e=>e.res[r.key]!=null),v=xs.map(e=>e.res[r.key]);
    return {list,vals:g.conds.map(c=>list[0].cond[c.key]),st:gStat(list,r),min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null,pts:xs.map(e=>({v:e.res[r.key],id:e.id}))}})
   .sort((a,b)=>{for(let i=0;i<ord.length;i++){const d=ord[i].indexOf(a.vals[i])-ord[i].indexOf(b.vals[i]);if(d)return d}return 0});
}
// 분류: 평균 차이를 두 묶음의 표준편차와 비교
const gVerdict=x=>{if(x.sdA==null&&x.sdB==null)return '반복 없음';return Math.abs(x.delta)<=Math.max(x.sdA||0,x.sdB||0)?'편차 범위 안':x.delta>0?'증가':'감소'};
const gCV=st=>st.sd!=null&&st.mean?Math.abs(st.sd/st.mean)*100:null;
function gChart(g,r){ // 그래프에 필요한 값: 묶음, 세로축 범위와 눈금
  const rows=gSummary(g,r).filter(x=>x.st.n);if(!rows.length)return null;
  let lo=Infinity,hi=-Infinity;rows.forEach(x=>{const s=x.st.sd||0;lo=Math.min(lo,x.min,x.st.mean-s);hi=Math.max(hi,x.max,x.st.mean+s)});
  if(lo===hi){lo-=1;hi+=1}
  const raw=(hi-lo)/4,p=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(k=>k*p).find(v=>v>=raw*.999);
  const y0=Math.floor(lo/step+1e-9)*step,y1=Math.ceil(hi/step-1e-9)*step,ticks=[];for(let t=y0;t<=y1+step/1e6;t+=step)ticks.push(+t.toFixed(10));
  return {rows,y0,y1,ticks,flags:gFlags(g,r),dp:Math.max(0,-Math.floor(Math.log10(step)+1e-9))};
}
// 글자 폭 어림(한글 10, 그 외 5.6)과 두 줄 나누기
const gTw=t=>[...String(t)].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2E80?10:5.6),0);
function gLab2(t,w){
  if(gTw(t)<=w)return [t,''];
  const cutTo=(q,lim)=>{let o='';for(const ch of q){if(gTw(o+ch+'…')>lim)return o+'…';o+=ch}return o};
  const tok=t.split(' ');let a='',i=0;
  while(i<tok.length&&gTw((a?a+' ':'')+tok[i])<=w){a=(a?a+' ':'')+tok[i];i++}
  if(!a)return [cutTo(t,w),''];
  const b=tok.slice(i).join(' ');return [a,gTw(b)<=w?b:cutTo(b,w)];
}
function gChartSVG(g,r){ // 점 = 측정값, 주황 선 = 평균, 세로 막대 = 평균 ± 표준편차
  const m=gChart(g,r);if(!m)return '';

  const n=m.rows.length,L=50,T=12,B=long?58:46,H=long?262:250,gw=Math.max(long?62:46,Math.min(92,(326-L-8)/n)),W=Math.round(L+n*gw+8),ph=H-T-B,Y=v=>+(T+ph*(1-(v-m.y0)/(m.y1-m.y0))).toFixed(1);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(r.label)} 조건별 그래프" style="display:block;font-family:var(--mono)">`;
  m.ticks.forEach(t=>{o+=`<line x1="${L}" x2="${W-4}" y1="${Y(t)}" y2="${Y(t)}" stroke="#E7E9F1"/><text x="${L-6}" y="${Y(t)+4}" font-size="10" text-anchor="end" fill="#687083">${t.toFixed(m.dp)}</text>`});
  o+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="#252B3B"/><line x1="${L}" x2="${W-4}" y1="${T+ph}" y2="${T+ph}" stroke="#252B3B"/>`;
  m.rows.forEach((q,i)=>{const cx=+(L+gw*(i+.5)).toFixed(1),k=q.pts.length;
    o+=`<line x1="${cx-13}" x2="${cx+13}" y1="${Y(q.st.mean)}" y2="${Y(q.st.mean)}" stroke="#5266E0" stroke-width="3"/>`;
    if(q.st.sd!=null){const a=Y(q.st.mean+q.st.sd),b=Y(q.st.mean-q.st.sd);o+=`<path d="M${cx} ${a}V${b}M${cx-5} ${a}h10M${cx-5} ${b}h10" stroke="#252B3B" fill="none"/>`}
    q.pts.forEach((pt,j)=>{const dx=Math.max(-17,Math.min(17,(j-(k-1)/2)*7)),bad=m.flags.has(pt.id);o+=`<circle cx="${cx+dx}" cy="${Y(pt.v)}" r="3.5" fill="${bad?'#C2504A':'#fff'}" stroke="${bad?'#C2504A':'#252B3B'}" stroke-width="1.5"/>`});
    const [l1,l2]=gLab2(q.vals.join(' · ')||'전체',gw-4);
    o+=`<text x="${cx}" y="${T+ph+15}" font-size="10" text-anchor="middle" fill="#252B3B" style="font-family:var(--sans)">${esc(l1)}${l2?`<tspan x="${cx}" dy="12">${esc(l2)}</tspan>`:''}</text>`});
  return o+`<text x="${L+(W-L)/2}" y="${H-10}" font-size="10" text-anchor="middle" fill="#687083" style="font-family:var(--sans)">${esc(g.conds.map(c=>c.label).join(' · '))}</text></svg>`;
}
function gSumBody(g,r){ // 그래프 + 조건별 요약표 + 조건별 영향 분류 (그래프 탭과 결과 모아보기에서 같이 씀)

    eff.slice(0,30).map(x=>{const v=gVerdict(x);return `<tr><td>${esc(x.cond.label)}</td><td>${esc(x.from)} → ${esc(x.to)}</td>${anyO?`<td>${esc(x.others)}</td>`:''}<td>${fm(x.meanA,r)} → ${fm(x.meanB,r)}</td><td>${v==='증가'?'<span class="tag o">▲ 증가</span>':v==='감소'?'<span class="tag" style="background:var(--ink);color:#fff">▼ 감소</span>':`<span class="tag g">${v}</span>`}</td>${anyP?`<td>${x.paired?`${x.paired.n}쌍 중 증가 ${x.paired.up} · 감소 ${x.paired.down}`:''}</td>`:''}</tr>`}).join('')+`</tbody></table></div>`;

function gSum(g){

  return gSumBody(g,gRes(g))+`<div class="gnote">"결과 모아보기"의 PDF에 결과 열마다 이 그래프와 표가 들어가요.</div>`;

// 결론·고찰에 넣을 문장: 표에서 계산한 사실만 (해석은 넣지 않음)
function gAuto(g,kind){
  const L=[];
  g.results.forEach(r=>{
    if(kind==='concl'){ // 조건마다, 나머지 조건이 같은 묶음에서 가장 멀리 떨어진 두 값을 비교
      if(g.bySample&&g.rows.length>2){const ex=gExtremes(g,r);if(ex)L.push(`${r.label}: 가장 큰 값은 ${ex.max.name}(${fv(ex.max.res[r.key],r)}), 가장 작은 값은 ${ex.min.name}(${fv(ex.min.res[r.key],r)})였다.`)}
      else{gKeyEffects(g,r).forEach(x=>L.push(gLine(g,r,x)));gTied(g,r).forEach(x=>L.push(gTiedLine(g,r,x)))}
    }else{
      const fl=gFlags(g,r),gm=gGroups(g);
      g.rows.forEach(e=>{if(!fl.has(e.id))return;const v=e.res[r.key];
        if(r.isYield&&v>100)L.push(`확인 필요: ${e.name}의 ${r.label} = ${fv(v,r)} (100 %를 넘음).`);
        else{const med=gMed(gm.get(gKey(g,e)).map(q=>q.res[r.key]).filter(q=>q!=null));L.push(`확인 필요: ${e.name}의 ${r.label} = ${fv(v,r)} (같은 조건의 중앙값 ${fm(med,r)}와 크게 다름).`)}});
      const rep=gSummary(g,r).filter(x=>x.st.n>=3&&gCV(x.st)!=null).sort((a,b)=>gCV(b.st)-gCV(a.st))[0];
      if(rep)L.push(`${r.label}의 반복 측정 편차가 가장 큰 조건: ${g.conds.map((c,i)=>`${c.label} ${rep.vals[i]}`).join(', ')} (표준편차 ${fm(rep.st.sd,r)}, CV ${gCV(rep.st).toFixed(1)} %, ${rep.st.n}회).`);
      const none=g.rows.filter(e=>e.miss&&e.miss[r.key]==='none').length;if(none)L.push(`${r.label}: "없음"으로 기록된 측정 ${none}건.`);
    }
  });
  if(kind==='disc'&&g.conds.length&&!g.bySample){const rk=gRank(g,gRes(g)),gaps=[...rk.byKey.values()];
    if(gaps.length)L.push(`실행하지 않은 조건 조합 ${gaps.length}개 (전체 ${gTotal(g)}개): `+gaps.slice(0,5).map(q=>g.conds.map((c,i)=>`${c.label} ${q.vals[i]}`).join(' · ')).join(' / ')+(gaps.length>5?' 등':'')+'.')}
  return L;
}

/* --- 단계에서 적은 측정값 → 결과 분석 표 --- */
const UNITS=['mg','kg','g','μL','mL','L','mM','M','mmol','mol','nm','cm⁻¹','°C','℃','%','rpm','분','시간','h','min'];
const mKey=m=>m.label+(m.unit?` (${m.unit})`:'');
const allMeas=e=>{const a=[];e.steps.forEach(s=>(s.meas||[]).forEach(m=>a.push(m)));return a};
function measSets(e){ // 시료나 항목이 하나라도 겹치는 단계끼리 묶음 → [[단계,…],…]
  const st=e.steps.filter(q=>(q.meas||[]).some(m=>m.sample)).map(q=>{const ms=q.meas.filter(m=>m.sample);return {s:q,sm:new Set(ms.map(m=>m.sample)),ck:new Set(ms.map(mKey))}});
  const par=st.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++)if([...st[i].sm].some(v=>st[j].sm.has(v))||[...st[i].ck].some(v=>st[j].ck.has(v)))par[find(i)]=find(j);
  const gr=new Map();st.forEach((q,i)=>{const k=find(i);if(!gr.has(k))gr.set(k,[]);gr.get(k).push(q.s)});
  return [...gr.values()];
}
function measTable(e,steps){ // 줄 = 시료, 열 = 측정 이름. 같은 시료·이름이 여러 번이면 마지막 값
  const all=(steps?steps.flatMap(q=>q.meas||[]):allMeas(e)).filter(m=>m.sample);if(!all.length)return null; // 시료 이름이 있는 것만
  const samples=[...new Set(all.map(m=>m.sample))],cols=[...new Set(all.map(mKey))];
  return {header:['시료'].concat(cols),count:all.length,rows:samples.map(sm=>[sm].concat(cols.map(c=>{const hit=all.filter(m=>m.sample===sm&&mKey(m)===c).pop();return hit?hit.value:''})))};
}
function measMini(s){ // 한 단계의 측정값을 표로: 줄 = 시료(없으면 "공통"), 열 = 측정 이름
  const cols=[...new Set(s.meas.map(mKey))],names=[...new Set(s.meas.map(m=>m.sample||'공통'))];
  return {head:['시료'].concat(cols),rows:names.map(n=>[n].concat(cols.map(c=>{const hit=s.meas.filter(m=>(m.sample||'공통')===n&&mKey(m)===c).pop();return hit?hit.value:''})))};
}
function mSuggest(s){ // 사진 메모·관찰 메모에서 "이름 숫자 단위"를 찾음 (규칙 기반, 제안만 함)
  const have=new Set((s.meas||[]).map(m=>m.label+'|'+m.value+'|'+m.unit)),out=[];
  const re=new RegExp('((?:[A-Za-z][A-Za-z-]*\\s+){0,2}\\S+)\\s+([-+]?\\d+(?:\\.\\d+)?)\\s*('+[...UNITS].sort((a,b)=>b.length-a.length).join('|')+')(?![A-Za-z])','g');
  s.photos.map(p=>p.memo).concat([s.obs.text]).filter(Boolean).forEach(t=>{let m;while((m=re.exec(t))){const label=m[1].replace(/[,:;]$/,'');if(!/[A-Za-z가-힣]/.test(label))continue; // "= 4.500 g"처럼 이름이 없는 것은 건너뜀
    const k=label+'|'+m[2]+'|'+m[3];if(!have.has(k)){have.add(k);out.push({label,value:m[2],unit:m[3]})}}});
  return out.slice(0,6);
}
// 제안 버튼 부분만 따로 그림 (메모를 고친 뒤 화면 전체를 다시 그리지 않고 이 부분만 바꿈)
function mSugHTML(s){const sug=mSuggest(s);V.msug=sug;
  return sug.length?`<div class="by" style="margin-top:12px">메모에서 찾은 숫자 · 누르면 "공통" 줄에 들어가요</div><div class="chips" style="padding:6px 0 0">${sug.map((q,i)=>`<button class="chip" data-a="mPick" data-i="${i}" style="padding:5px 9px">${esc(q.label)} ${esc(q.value)} ${esc(q.unit)}</button>`).join('')}</div>`:''}
// 한 단계의 표 구조를 보관: s.mcols = 항목(열), s.mrows = 시료(줄). 값은 s.meas에 납작하게 저장
function mEnsure(s){
  s.meas=s.meas||[];s.mcols=s.mcols||[];s.mrows=s.mrows||[];
  s.meas.forEach(m=>{if(!s.mcols.some(c=>mKey(c)===mKey(m)))s.mcols.push({label:m.label,unit:m.unit});if(m.sample&&!s.mrows.includes(m.sample))s.mrows.push(m.sample)});

const mGet=(s,sample,c,key)=>{const k=key||mKey(c),hit=(s.meas||[]).filter(m=>m.sample===sample&&mKey(m)===k).pop();return hit?hit.value:''};
function mSet(s,sample,c,value){s.meas=(s.meas||[]).filter(m=>!(m.sample===sample&&mKey(m)===mKey(c)));if(value!=='')s.meas.push({id:uid(),sample,label:c.label,unit:c.unit,value,by:ME,at:Date.now()})}
// 계산 항목(예: 수득률 = 실제 ÷ 이론 × 100)을 다시 계산. 바뀐 칸 [줄, 열, 값]을 돌려줌
function mRecalc(s,e){
  e=e||exp();const out=[],rows=[''].concat(s.mrows),toNum=v=>{const n=Number(String(v).replace(/,/g,''));return v===''||isNaN(n)?null:n};
  // 이 단계 → 다른 단계 순서로 값을 찾음
  const look=(r,key)=>{let v=mGet(s,r,{label:key,unit:''},key);if(v!=='')return toNum(v);for(const q of e.steps){if(q===s)continue;const hit=(q.meas||[]).filter(m=>m.sample===r&&mKey(m)===key).pop();if(hit)return toNum(hit.value)}return null};
  s.mcols.forEach((c,j)=>{if(!c.calc)return;
    rows.forEach((r,i)=>{let a=look(r,c.calc.a),b=look(r,c.calc.b),v='';
      if(r!==''&&(a!==null||b!==null)){if(a===null)a=look('',c.calc.a);if(b===null)b=look('',c.calc.b)} // 시료 줄에 없는 값은 공통 줄에서 가져옴
      if(a!==null&&b!==null){const q=({'÷':a/b,'×':a*b,'−':a-b,'+':a+b})[c.calc.op]*(c.calc.k||1);if(isFinite(q))v=String(Number(q.toPrecision(4)))}
      if(mGet(s,r,c)!==v){mSet(s,r,c,v);out.push([i,j,v])}})});
  return out;
}

function mYieldPair(s){const c=(s.mcols||[]).filter(q=>!q.calc),a=c.find(q=>/실제|얻은/.test(q.label)),b=c.find(q=>/이론/.test(q.label));

      gField('새 항목 이름',`<input id="mk-label" placeholder="예: 수득률">`)+gField('단위',`<input id="mk-unit" placeholder="예: %">`)+`</div>`+
      `<button class="btn black sm" data-a="mCalcAdd" style="margin-top:12px">계산 항목 추가</button><div class="by" style="margin-top:8px">값을 고치면 자동으로 다시 계산돼요. 이 단계에 없는 값은 같은 시료 이름으로 다른 단계에서, 그래도 없으면 "공통" 줄에서 가져와요.</div></div>`}
  out+=`<div id="msug">${mSugHTML(s)}</div>`;
  return out+`<div class="by" style="margin-top:10px">시료 이름이 있는 값은 "결과 분석"에 자동으로 모여요.</div></div>`;
}
// 표와 열 역할로 조건·결과·기록을 만듦. 숫자로 읽지 못한 결과 칸 수를 돌려줌
function gApply(g,p,roles,idOf){
  const idx=k=>roles.map((x,i)=>x===k?i:-1).filter(i=>i>=0),ni=idx('name')[0],pi=idx('rep')[0],ci=idx('cond'),ri=idx('result'),ti=idx('note');let bad=0;
  const sig=()=>g.conds.map(c=>c.label).join(SEP)+'//'+g.results.map(r=>r.label).join(SEP),old=sig(),oldExtra=g.conds.map(c=>c.extra||[]);
  g.conds=ci.map((i,k)=>({key:'c'+k,label:p.header[i],extra:[]}));
  g.results=ri.map((i,k)=>({key:'r'+k,label:p.header[i],dp:0,isYield:/수율|수득률|yield/i.test(p.header[i])&&p.header[i].includes('%')}));
  g.repLabel=pi!==undefined?p.header[pi]:'';
  g.rows=p.rows.map((row,n)=>{const x={id:idOf?idOf(row,n):uid(),name:ni!==undefined?row[ni]??'':'실험 '+(n+1),rep:pi!==undefined?(row[pi]??'').trim():'',cond:{},res:{},miss:{},note:ti.map(i=>row[i]??'').filter(Boolean).join(' / ')};
    ci.forEach((i,k)=>x.cond['c'+k]=(row[i]??'').trim()||'–');
    ri.forEach((i,k)=>{const c=parseCell(row[i]);x.res['r'+k]=c.v;if(c.miss)x.miss['r'+k]=c.miss;if(c.bad)bad++;if(c.dp)g.results[k].dp=Math.min(4,Math.max(g.results[k].dp,c.dp))});return x});
  if(sig()===old)g.conds.forEach((c,i)=>c.extra=oldExtra[i]); // 열이 그대로면 추가한 값·계획·문헌 유지
  else{g.plans=[];g.refs.forEach(x=>{x.cond=null;x.rkey=null;x.value=null})}

}
// 자료 출처가 "단계 측정값"이면 화면을 그릴 때마다 표를 다시 만듦
const COND_RE=/농도|온도|시간|부피|원액|첨가|넣은|조건|비율|당량|pH|속도|전압|\((M|mM|mL|μL|L|℃|°C|분|시간|h|min|rpm)\)\s*$/i;
function gSync(e){
  const g=e.gap||(e.gap=defaultGap());if(!g.source)g.source=g.rows.length?'table':'steps';
  if(g.source!=='steps'){g.bySample=false;return}
  const sets=measSets(e);g.mset=Math.min(g.mset||0,Math.max(0,sets.length-1));g.msetNames=sets.length>1?sets.map(ss=>ss.map(q=>q.title).join(' + ')):[];
  const p=measTable(e,sets.length>1?sets[g.mset]:null),clear=()=>{Object.assign(g,{conds:[],results:[],repLabel:'',rows:[],curRes:null});g.mhead=p?p.header:null;g.bySample=false};
  if(!p){clear();return}
  g.mroles=g.mroles||{};
  const isNum=j=>{const v=p.rows.map(r=>r[j]).filter(q=>q!=='');return v.length>0&&v.every(q=>NONE_RE.test(q)||!isNaN(Number(String(q).replace(/,/g,''))))};
  // 추정: 글자로 된 값은 메모, 숫자는 이름·단위가 "바꿔 준 값"처럼 보이면 조건, 아니면 결과
  const roles=p.header.map((h,i)=>i===0?'name':g.mroles[h]||(!isNum(i)?'note':COND_RE.test(h)&&!RESULT_RE.test(h)?'cond':'result'));
  g.mnow=roles;
  if(!roles.includes('result')){clear();g.mnow=roles;return} // 숫자 결과가 하나도 없음
  // 조건으로 볼 항목이 없으면 시료 자체를 비교 대상으로 삼음 (예: H₂salen과 Co(salen))
  g.bySample=!roles.includes('cond');
  if(g.bySample)gApply(g,{header:['시료','시료'].concat(p.header.slice(1)),rows:p.rows.map(r=>[r[0],r[0]].concat(r.slice(1)))},['name','cond'].concat(roles.slice(1)),row=>'m:'+row[0]);

}

/* --- 화면 --- */
const fv=(v,r)=>v.toFixed(r.dp), fm=(v,r)=>v.toFixed(Math.min(r.dp+1,4));
const gCell=(e,r)=>{const v=e.res[r.key];return v!=null?fv(v,r):(e.miss&&e.miss[r.key]==='none'?'없음':'')};
const gOpt=(list,cur)=>list.map(([v,n])=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(n)}</option>`).join('');
const gField=(label,inner)=>`<div class="gf"><label class="label">${esc(label)}</label>${inner}</div>`;
const gCondInputs=(g,pre)=>g.conds.map(c=>gField(c.label,`<input id="${pre}-${c.key}" list="${pre}l-${c.key}"><datalist id="${pre}l-${c.key}">${gVals(g,c).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`)).join('');
const gHasRep=g=>g.rows.some(e=>e.rep), gHasNote=g=>g.rows.some(e=>e.note);

// 조사 "로/으로" 고르기 (숫자와 한글의 받침을 보고)
const josaRo=w=>{const ch=String(w).trim().slice(-1),d='0123456789'.indexOf(ch);
  if(d>=0)return [1,0,0,1,0,0,1,0,0,0][d]?'으로':'로'; // 0영 3삼 6육은 받침이 있고, 7칠 8팔은 ㄹ받침이라 "로"
  const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const j=(c-0xAC00)%28;return j===0||j===8?'로':'으로'}return ''}; // 영문·괄호로 끝나면 정할 수 없음
// "A에서 B로" (조사를 정할 수 없으면 "A → B")
const fromTo=(a,b)=>{const j=josaRo(b);return j?`${esc(a)}에서 ${esc(b)}${j}`:`${esc(a)} → ${esc(b)}`};
// 한 번만 잰 값은 적은 자릿수 그대로, 평균은 한 자리 더
const fx=(v,r,n)=>n>1?fm(v,r):fv(v,r);
// 조건마다, 나머지 조건이 같은 묶음에서 가장 멀리 떨어진 두 값의 비교만 고름
function gKeyEffects(g,r){const best=new Map();gEffects(g,r).forEach(x=>{const k=g.conds.indexOf(x.cond)+'|'+x.others,span=x.so[2]-x.so[1];if(!best.has(k)||span>best.get(k).span)best.set(k,{...x,span})});return [...best.values()]}

function gapHTML(e){
  gSync(e);const g=G();if(!V.gopen){V.gopen={in:!g.rows.length};V.gauto=!g.rows.length}
  if(V.gauto&&g.rows.length){V.gopen.in=false;V.gauto=false}

    :g.source==='steps'&&mt?`<b>숫자로 된 측정값이 없어요</b>적은 값이 모두 글자예요. 숫자로 된 결과가 하나 이상 있어야 그래프를 그릴 수 있어요.`
    :`<b>아직 분석할 숫자가 없어요</b>세 가지 방법 중 하나로 넣으면 그래프와 요약이 바로 나와요.<br>① 아래 "자료 넣기"에서 실험 PPT나 PDF, 사진을 AI가 읽게 하기<br>② 단계의 "자세히 · 메모"에서 측정값을 표로 적기<br>③ 아래 "자료 넣기"에서 표를 붙여넣기`;

  if(g.rows.length)out+=acc('cmp','실험 하나씩 비교','한 실험을 기준으로 나머지가 얼마나 다른지',()=>gCmp(g))+
    (g.bySample?'':acc('map','조합 지도','해본 조합과 안 해본 조합을 표로 보기',()=>gMap(g)))+
    acc('note','계획 · 참고 문헌',`계획 ${g.plans.length}건 · 문헌 ${g.refs.length}건`,()=>gNote(g));

}
// 조건이 함께 바뀌어 "하나만 다른 쌍"이 없을 때: 그 조건의 가장 작은 값과 큰 값을 비교하고, 같이 바뀐 조건을 알려 줌
function gTied(g,r){
  if(g.bySample||g.conds.length<2)return [];
  const has=new Set(gEffects(g,r).map(x=>x.cond.key)),out=[];
  g.conds.forEach(c=>{const vs=gVals(g,c).filter(v=>g.rows.some(q=>q.cond[c.key]===v&&q.res[r.key]!=null));if(has.has(c.key)||vs.length<2)return;
    const A=g.rows.filter(q=>q.cond[c.key]===vs[0]),B=g.rows.filter(q=>q.cond[c.key]===vs[vs.length-1]),sa=gStat(A,r),sb=gStat(B,r);if(!sa.n||!sb.n)return;

const gTiedLine=(g,r,x)=>`${x.cond.label} ${x.from} → ${x.to}: ${r.label}${Math.max(x.nA,x.nB)>1?' 평균':''} ${fx(x.meanA,r,x.nA)} → ${fx(x.meanB,r,x.nB)}. 단, ${x.also.map(o=>`${o.label}(${o.from} → ${o.to})`).join(', ')}도 함께 바뀌었으므로 어느 조건의 영향인지는 구분할 수 없다.`;
// 결론에 넣을 문장 한 줄 (카드의 "결론에 넣기"와 "계산 결과 넣기"가 같이 씀)
function gLine(g,r,x){const v=gVerdict(x);

    (x.others?`; ${x.others}`:'')+(x.paired?`; 같은 ${g.repLabel||'반복'}끼리 ${x.paired.n}쌍 중 증가 ${x.paired.up}, 감소 ${x.paired.down}`:'')+`). `+
    (v==='편차 범위 안'?'이 차이는 반복 측정의 표준편차보다 작다.':v==='반복 없음'?'반복 측정이 없어 편차와 비교하지 못했다.':'이 차이는 반복 측정의 표준편차보다 크다.')}

function gExtremes(g,r){const xs=g.rows.filter(q=>q.res[r.key]!=null);if(xs.length<2)return null;const s=[...xs].sort((a,b)=>a.res[r.key]-b.res[r.key]);return {min:s[0],max:s[s.length-1]}}

// 첫 화면: 무엇이 달라졌는지 → 그래프 → 요약표 → 확인할 값 → 안 해본 조합
function gHome(g,e){
  const r=gRes(g),mt=measTable(e),rp=RP();
  let o=`<div class="gintro"><b>${g.rows.length}건의 결과를 정리했어요</b>${g.source==='steps'?`단계에서 적은 측정값 ${mt?mt.count:0}개로 만들었어요.${g.bySample?' 조건으로 둔 항목이 없어서 시료끼리 비교해요.':''}`:g.preset?'수업 자료에 실린 6개 조의 결과예요. 시안이라 그래프에서 읽은 값을 넣어 두었어요.':'붙여넣은 표로 만들었어요.'}</div>`;
  if(g.source==='steps'&&(g.msetNames||[]).length>1)o+=`<div class="gh" style="padding-top:16px;font-size:13px">어느 측정을 볼까요?</div><div class="gpick">${g.msetNames.map((n,i)=>`<button class="${i===g.mset?'on':''}" data-a="gSetPick" data-i="${i}">${esc(n)}</button>`).join('')}</div><div class="gnote">시료와 항목이 서로 겹치지 않는 측정은 따로 정리해요.</div>`;
